<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js" crossorigin="anonymous"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js" crossorigin="anonymous"></script>
<style>
:root{
  --ink:#111;--ink2:#555;--ink3:#aaa;--rule:#e4e4e4;--bg:#fafaf8;
  --accent:#d63800;--mono:'DM Mono',monospace;
  --sans:'Noto Sans JP',-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif;
  --live:#2e5;--wait:#c80;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:var(--sans);background:var(--bg);min-height:100vh;color:var(--ink)}
button,input,textarea,select{font-family:var(--sans)}
button{cursor:pointer}
button:active{opacity:.75}
input:focus,textarea:focus{outline:none}
#app{min-height:100vh;display:flex;flex-direction:column}

.appbar{background:var(--ink);color:white;padding:13px 18px;font-size:15px;font-weight:300;letter-spacing:.05em;flex-shrink:0;position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between}
.appbar-title{font-size:15px;font-weight:400;color:rgba(255,255,255,.7);letter-spacing:.04em}
.appbar-help-btn{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;border:none;font-size:13px;font-weight:700;flex-shrink:0}
.appbar-right{font-family:var(--mono);font-size:15px;color:rgba(255,255,255,.45);letter-spacing:.04em}

.content{flex:1;overflow-y:auto}

.section-title{font-size:14px;font-weight:700;color:var(--ink);margin-bottom:12px;letter-spacing:.03em}
.card{background:white;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:16px 18px;margin-bottom:8px}
.field-label{font-size:12px;color:var(--ink3);margin-bottom:6px;font-weight:400;letter-spacing:.1em;text-transform:uppercase}
.field-inp{width:100%;border:none;border-bottom:1.5px solid var(--rule);background:transparent;padding:10px 0;font-size:18px;color:var(--ink)}
.field-inp:focus{border-bottom-color:var(--ink)}

.btn{border:none;border-radius:4px;font-weight:400;cursor:pointer;letter-spacing:.04em;transition:opacity .1s}
.btn-primary{background:var(--ink);color:white;padding:13px 22px;font-size:15px}
.btn-outline{background:white;border:1px solid var(--ink);color:var(--ink);padding:11px 18px;font-size:14px}
.btn-gray{background:#eee;color:var(--ink2);padding:11px 18px;font-size:14px;border:1px solid var(--rule)}
.btn-danger{background:var(--accent);color:white;padding:11px 18px;font-size:14px}
.btn:disabled{opacity:.4;cursor:default}

/* 設定画面：洗練されたリスト風の行 */
.settings-section{margin:18px 18px 0}
.settings-section-title{font-size:11px;color:var(--ink3);letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px;padding:0 4px}
.settings-list{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.04);border:1px solid var(--rule)}
.settings-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid var(--rule)}
.settings-row:last-child{border-bottom:none}
.settings-row-label{font-size:14px;color:var(--ink);font-weight:400}
.settings-row-sub{font-size:11px;color:var(--ink3);margin-top:2px}
.settings-row-action{flex-shrink:0}
.pill-btn{border:none;background:#f1f0ed;color:var(--ink);font-size:12.5px;padding:8px 14px;border-radius:999px;letter-spacing:.02em;transition:background .12s;cursor:pointer}
.pill-btn:active{background:#e2e0da}
.pill-btn.pill-dark{background:var(--ink);color:#fff}
.pill-btn.pill-dark:active{background:#333}
.pill-btn.pill-danger{background:#fdeae4;color:var(--accent)}
.pill-btn.pill-danger:active{background:#fadad0}
.settings-inp{border:1px solid var(--rule);border-radius:8px;padding:8px 10px;font-size:13px;font-family:var(--mono);width:100%;background:#faf9f7}
.search-hit{display:flex;align-items:center;gap:8px;padding:8px 4px;font-size:13px;border-bottom:1px solid var(--rule)}
.search-hit:last-child{border-bottom:none}

/* ══ CSVパース：時刻,試合コード,種目,選手A1,選手A2,選手B1,選手B2[,ラウンド] ══
   選手欄には、決まった相手の代わりに以下の参照記法も使える：
     #league:リーグ名:順位   … 例）#league:A2-A:1  → 「A2-A」というリーグの1位
     #winner:試合コード        … 例）#winner:MS1      → 試合コード MS1 の勝者（会場・グループをまたいで参照可）
     #winner:試合番号        … 例）#winner:1        → 従来互換：同じグループ内の1番目の試合の勝者
   参照記法を含む試合コードのグループ（例: X-1, X-2, X-3）は、
   通常のキュー登録ではなく「ブラケット（勝ち上がり）」として自動的にまとめられる。 */
function csvParseRows(text){
  var lines=text.trim().split('\n').filter(Boolean);
  return lines.slice(1).map(function(line){
    var cols=line.split(',').map(function(s){return s.trim().replace(/^"|"$/g,'');});
    return {
      time:cols[0]||'', code:cols[1]||'',
      type:(cols[2]||'').indexOf('ダブル')>=0?'doubles':'singles',
      a1:cols[3]||'', a2:cols[4]||'', b1:cols[5]||'', b2:cols[6]||'',
      round: parseInt(cols[7],10)||1,
      a1Club:cols[8]||'', a2Club:cols[9]||'', b1Club:cols[10]||'', b2Club:cols[11]||''
    };
  }).filter(function(r){ return r.code || r.a1 || r.b1; });
}

function csvParseMatches(text){
  return csvParseRows(text).map(function(r){
    var teamA=[r.a1];if(r.type==='doubles'&&r.a2)teamA.push(r.a2);
    var teamB=[r.b1];if(r.type==='doubles'&&r.b2)teamB.push(r.b2);
    return{id:uid(),time:r.time,matchCode:r.code,matchType:r.type,teamA:teamA,teamB:teamB};
  });
}

function parseRefOrNames(v1, v2){
  var v = (v1||'').trim();
  if(v.indexOf('#league:')===0){
    var rest = v.slice('#league:'.length);
    var idx = rest.lastIndexOf(':');
    if(idx>0){
      return { ref: { type:'leagueRank', leagueId: rest.slice(0,idx), rank: parseInt(rest.slice(idx+1),10)||1 } };
    }
  }
  if(v.indexOf('#winner:')===0){
    var winnerToken = v.slice('#winner:'.length).trim();
    // 新仕様：#winner:MS1 のように実際の試合コードを直接参照する。
    // 数字だけの場合は従来CSVとの互換性のため『同じグループ内のN番目』として扱う。
    if(/^\d+$/.test(winnerToken)) return { ref:{ type:'matchWinner', localNum:parseInt(winnerToken,10)||1 } };
    return { ref:{ type:'matchWinnerCode', matchCode:winnerToken } };
  }
  return { names: [v1, v2].filter(Boolean) };
}

/* CSV全体を「通常のキュー登録行」と「参照記法を含むブラケット」に振り分ける */
function csvParseMatchesAndBrackets(text){
  var rows = csvParseRows(text);
  var queue = [];
  var brackets = {};
  var consumed = {};

  /* MS1 / MS2 / ... のように「種目コード+通番」で構成される大会トーナメントは、
     ROUND 1 に #winner 参照が無くても、同一種目の後続ラウンドに勝者参照があれば
     ROUND 1 から決勝までを1つのbracketとして保持する。
     これにより表示だけでなく、ROUND 1終了→ROUND 2への自動勝ち上がりも同じ構造になる。 */
  var codeGroups = {}, codeOrder=[];
  rows.forEach(function(r,i){
    var cm=/^([A-Za-z]+)(\d+)$/.exec(String(r.code||'').trim());
    if(!cm) return;
    var prefix=cm[1].toUpperCase();
    if(!codeGroups[prefix]){ codeGroups[prefix]=[]; codeOrder.push(prefix); }
    codeGroups[prefix].push({row:r,rowIndex:i,codeNum:parseInt(cm[2],10)||0});
  });
  var eventNames={MS:'男子シングルス',WS:'女子シングルス',MD:'男子ダブルス',WD:'女子ダブルス',XD:'混合ダブルス'};
  codeOrder.forEach(function(prefix){
    var entries=codeGroups[prefix];
    var hasLaterRound=entries.some(function(e){return Number(e.row.round||1)>1;});
    var hasWinnerRef=entries.some(function(e){
      var ai=parseRefOrNames(e.row.a1,e.row.a2), bi=parseRefOrNames(e.row.b1,e.row.b2);
      return !!(ai.ref && (ai.ref.type==='matchWinner'||ai.ref.type==='matchWinnerCode')) ||
             !!(bi.ref && (bi.ref.type==='matchWinner'||bi.ref.type==='matchWinnerCode'));
    });

    if(!hasLaterRound && !hasWinnerRef) return;
    var bracketId=uid();
    entries.sort(function(a,b){

    var matches=entries.map(function(e,idx){
      consumed[e.rowIndex]=true;
      var ai=parseRefOrNames(e.row.a1,e.row.a2), bi=parseRefOrNames(e.row.b1,e.row.b2);
      function toSlot(info){
        if(!info.ref) return {type:'fixed',names:info.names};
        if(info.ref.type==='matchWinner') return {type:'matchWinner',bracketId:bracketId,matchId:info.ref.localNum-1};
        if(info.ref.type==='matchWinnerCode') return {type:'matchWinnerCode',matchCode:info.ref.matchCode};
        return info.ref;
      }
      return {id:idx,matchCode:e.row.code,time:e.row.time||'',round:e.row.round||1,
        slotA:toSlot(ai),slotB:toSlot(bi),teamA:null,teamB:null,queued:false,result:null};
    });
    brackets[bracketId]={id:bracketId,name:(eventNames[prefix]||prefix)+' トーナメント',matches:matches};
  });

  // 上記で大会トーナメントとして取り込まれなかった行は、従来形式で処理する。
  var groups = {}; var order = [];
  rows.forEach(function(r, i){
    if(consumed[i]) return;
    var m = /^(.*)-(\d+)$/.exec(r.code);
    var groupName = m ? m[1] : ('__単独__'+i);
    var num = m ? parseInt(m[2],10) : 1;
    if(!groups[groupName]){ groups[groupName]=[]; order.push(groupName); }
    groups[groupName].push({num:num, row:r});
  });

  order.forEach(function(groupName){
    var entries = groups[groupName].slice().sort(function(a,b){return a.num-b.num;});
    var aInfo = entries.map(function(e){ return parseRefOrNames(e.row.a1, e.row.a2); });
    var bInfo = entries.map(function(e){ return parseRefOrNames(e.row.b1, e.row.b2); });
    var hasRef = aInfo.some(function(x){return x.ref;}) || bInfo.some(function(x){return x.ref;});

    if(!hasRef){
      entries.forEach(function(e, idx){
        queue.push({ id:uid(), time:e.row.time, matchCode:e.row.code, matchType:e.row.type,
          teamA:aInfo[idx].names, teamB:bInfo[idx].names });
      });
    }else{
      var bracketId = uid();
      var matches = entries.map(function(e, idx){
        function toSlot(info){
          if(!info.ref) return { type:'fixed', names: info.names };
          if(info.ref.type==='matchWinner') return { type:'matchWinner', bracketId:bracketId, matchId: info.ref.localNum-1 };
          if(info.ref.type==='matchWinnerCode') return { type:'matchWinnerCode', matchCode:info.ref.matchCode };
          return info.ref;
        }
        return { id: idx, matchCode:e.row.code, time:e.row.time||'', round: e.row.round||1, slotA: toSlot(aInfo[idx]), slotB: toSlot(bInfo[idx]),
          teamA:null, teamB:null, queued:false, result:null };
      });
      brackets[bracketId] = { id:bracketId, name: groupName.indexOf('__単独__')===0 ? ('試合'+(order.indexOf(groupName)+1)) : groupName, matches: matches };
    }
  });

  return { queue: queue, brackets: brackets };
}

function readCsvFile(file,callback){
  var reader=new FileReader();
  reader.onload=function(e){
    var buf=e.target.result,utf8=null;
    try{utf8=new TextDecoder('utf-8',{fatal:true}).decode(buf);}catch(err){utf8=null;}
    if(utf8){callback(utf8);return;}
    try{callback(new TextDecoder('shift-jis').decode(buf));}
    catch(err2){callback(new TextDecoder('utf-8',{fatal:false}).decode(buf));}
  };
  reader.readAsArrayBuffer(file);
}
function toArray(val){
  if(!val)return[];
  if(Array.isArray(val))return val;
  return Object.keys(val).sort(function(a,b){return Number(a)-Number(b);}).map(function(k){return val[k];});
}

/* ══ ラウンドロビン組み合わせパターン ══
   n=3,4,5 は実データの巡回表と一致確認済み。6人以上は一般的な循環法アルゴリズムで
   生成（数学的に正しい総当たりにはなるが、実際の大会要項の番号順とは異なる場合がある） */
function circleMethodPairs(n){
  var arr = []; for(var i=0;i<n;i++) arr.push(i);
  if(n % 2 === 1) arr.push(-1); // 奇数は不戦(bye)を1枠追加
  var m = arr.length;
  var a = arr.slice();
  var flat = [];
  for(var r=0;r<m-1;r++){
    for(var i=0;i<m/2;i++){
      var x=a[i], y=a[m-1-i];
      if(x!==-1 && y!==-1) flat.push([x,y]);
    }
    var last = a.pop(); a.splice(1,0,last);
  }
  return flat;
}
function roundRobinPairs(n){
  if(n===2) return [[0,1]];
  if(n===3) return [[0,1],[0,2],[1,2]];
  if(n===4) return [[0,1],[2,3],[0,2],[1,3],[0,3],[1,2]];
  if(n===5) return [[0,1],[3,4],[0,2],[1,3],[2,4],[0,3],[1,4],[2,3],[0,4],[1,2]];
  return circleMethodPairs(n);
}

/* ══ リーグ（総当たり）の順位計算 ══
   順位決定: ①マッチ勝率 → ②取得ゲーム率 → ③取得ポイント率
             → ④同率者間の直接対決 → ⑤抽選・運営判断（手動確定）。 */
function computeStandings(league){
  var n = (league.participants||[]).length;
  var stats = (league.participants||[]).map(function(_, idx){
    return { idx:idx, wins:0, losses:0, gamesWon:0, gamesLost:0, pointsWon:0, pointsLost:0 };
  });
  var matches = toArray(league.matches);
  matches.forEach(function(m){
    if(!m.result || m.result.voided) return;
    var a = stats[m.i], b = stats[m.j];
    if(!m.result.excludeGamePoint){
      a.gamesWon += m.result.gameWinsA||0; a.gamesLost += m.result.gameWinsB||0;
      b.gamesWon += m.result.gameWinsB||0; b.gamesLost += m.result.gameWinsA||0;
      a.pointsWon += m.result.pointsA||0; a.pointsLost += m.result.pointsB||0;
      b.pointsWon += m.result.pointsB||0; b.pointsLost += m.result.pointsA||0;
    }
    if(m.result.winner==='A'){ a.wins++; b.losses++; } else if(m.result.winner==='B'){ b.wins++; a.losses++; }
  });
  stats.forEach(function(s){
    var played = s.wins+s.losses;
    s.matchRate = played>0 ? s.wins/played : 0;
    s.gameRate = (s.gamesWon+s.gamesLost)>0 ? s.gamesWon/(s.gamesWon+s.gamesLost) : 0;
    s.pointRate = (s.pointsWon+s.pointsLost)>0 ? s.pointsWon/(s.pointsWon+s.pointsLost) : 0;
  });
  var allDone = matches.length>0 && matches.every(function(m){ return !!m.result; });
  if(!allDone) return { complete:false, stats:stats };

  if(league.tieOverride && league.tieOverride.length===n){
    var order = league.tieOverride;
    return { complete:true, ranking: order.map(function(idx,i){ return Object.assign({},stats[idx],{rank:i+1}); }) };
  }

  function sameRate(a,b){ return Math.abs(a-b)<1e-10; }
  var sorted = stats.slice().sort(function(x,y){
    if(!sameRate(y.matchRate,x.matchRate)) return y.matchRate-x.matchRate;
    if(!sameRate(y.gameRate,x.gameRate)) return y.gameRate-x.gameRate;
    if(!sameRate(y.pointRate,x.pointRate)) return y.pointRate-x.pointRate;
    return 0;
  });

  // ①～③が同じ選手・ペアをグループ化し、④同率者間の直接対決で順位を決める。
  var groups=[];
  sorted.forEach(function(s){
    var g=groups[groups.length-1];
    if(g && sameRate(g[0].matchRate,s.matchRate) && sameRate(g[0].gameRate,s.gameRate) && sameRate(g[0].pointRate,s.pointRate)) g.push(s);
    else groups.push([s]);
  });

  var unresolved=false, finalOrder=[];
  groups.forEach(function(group){
    if(group.length===1){ finalOrder.push(group[0]); return; }
    var ids={}; group.forEach(function(s){ ids[s.idx]=true; s.headToHeadWins=0; s.headToHeadLosses=0; });
    matches.forEach(function(m){
      if(!m.result || m.result.voided || !ids[m.i] || !ids[m.j]) return;
      var a=group.filter(function(s){return s.idx===m.i;})[0];
      var b=group.filter(function(s){return s.idx===m.j;})[0];
      if(m.result.winner==='A'){ a.headToHeadWins++; b.headToHeadLosses++; }
      else if(m.result.winner==='B'){ b.headToHeadWins++; a.headToHeadLosses++; }
    });
    group.sort(function(a,b){ return b.headToHeadWins-a.headToHeadWins; });
    for(var i=1;i<group.length;i++) if(group[i-1].headToHeadWins===group[i].headToHeadWins) unresolved=true;
    finalOrder=finalOrder.concat(group);
  });

  if(unresolved) return { complete:true, needsManualTiebreak:true, stats:finalOrder };
  return { complete:true, ranking: finalOrder.map(function(s,i){ return Object.assign({},s,{rank:i+1}); }) };
}
/* ══ ブラケットのスロット参照解決 ══
   ref: {type:'fixed', names} | {type:'leagueRank', leagueId, rank} | {type:'matchWinner', bracketId, matchId}
        | {type:'matchWinnerCode', matchCode} */
function resolveSlotRef(data, ref){
  if(!ref) return null;
  if(ref.type==='fixed') return ref.names;
  if(ref.type==='leagueRank'){
    var lg = (data.leagues||{})[ref.leagueId];
    if(!lg){
      // IDで直接見つからない場合は、リーグ名としても探す
      // （CSVの #league:リーグ名:順位 記法は、リーグがまだ作成されていない段階でも
      //   参照できるよう、IDではなく名前で指定できるようにしているため）
      var byName = Object.keys(data.leagues||{}).map(function(k){ return data.leagues[k]; })
        .filter(function(l){ return l.name===ref.leagueId; })[0];
      lg = byName;
    }
    if(!lg) return null;
    var st = computeStandings(lg);
    if(!st.complete || st.needsManualTiebreak || !st.ranking) return null;
    var entry = st.ranking.filter(function(r){ return r.rank===ref.rank; })[0];
    if(!entry) return null;
    return lg.participants[entry.idx];
  }
  if(ref.type==='matchWinner'){
    var br = (data.brackets||{})[ref.bracketId];
    if(!br) return null;
    var m = toArray(br.matches).filter(function(x){ return x.id===ref.matchId; })[0];
    if(!m || !m.result) return null;
    return m.result.winner==='A' ? m.teamA : m.teamB;
  }
  if(ref.type==='matchWinnerCode'){
    var code = String(ref.matchCode||'').trim();
    if(!code) return null;
    // まず全試合共通の完了結果台帳を見る。別会場・別グループの試合でも、
    // 同じ大会データに結果が入っていれば試合コードだけで勝者を解決できる。
    var done = (data.completedMatches||{})[code];
    if(done && done.winnerTeam) return done.winnerTeam;
    // 旧データや進行状況CSVから復元したデータにも対応するため、ブラケット全体を検索。
    var bs=data.brackets||{};
    for(var bid in bs){
      var mm=toArray(bs[bid].matches).filter(function(x){return String(x.matchCode||'')===code;})[0];
      if(mm && mm.result) return mm.result.winner==='A' ? mm.teamA : mm.teamB;
    }
    // リーグ戦コードも検索（外部会場分を同一大会へ取り込んだ場合に有効）。
    var ls=data.leagues||{};
    for(var lid in ls){
      var lm=toArray(ls[lid].matches).filter(function(x){return String(x.matchCode||'')===code;})[0];
      if(lm && lm.result) return lm.result.winner==='A' ? lm.teamA : lm.teamB;
    }
    return null;
  }
  return null;
}

/* ══ ①バドるから届いた結果をリーグ／ブラケットへ反映 ══ */
function applyPendingResults(data){
  var courts = data.courts || {};
  var leagues = Object.assign({}, data.leagues||{});
  var brackets = Object.assign({}, data.brackets||{});
  var newCourts = Object.assign({}, courts);
  var queue = toArray(data.queue).slice();
  var durations = toArray(data.matchDurations).slice();
  var withdrawnPlayers = Object.assign({}, data.withdrawnPlayers||{});
  var completedMatches = Object.assign({}, data.completedMatches||{});
  var changed = false;

  Object.keys(courts).forEach(function(key){
    var c = courts[key];
    if(!c || !c.lastResult || c.lastResult.applied) return;
    var r = c.lastResult;
    var isDecisive = r.status === 'finished' && (r.winner==='A' || r.winner==='B');
    if(isDecisive){
      var resultCode = (r.matchCode || (c.match&&c.match.matchCode) || '').trim();
      if(resultCode){
        completedMatches[resultCode] = {
          matchCode:resultCode, winner:r.winner,
          winnerTeam:(r.winner==='A'?toArray(r.teamA):toArray(r.teamB)),
          teamA:toArray(r.teamA), teamB:toArray(r.teamB),
          gameWinsA:Number(r.gameWinsA)||0, gameWinsB:Number(r.gameWinsB)||0,
          pointsA:Number(r.pointsA)||0, pointsB:Number(r.pointsB)||0,
          gameScores:toArray(r.gameScores||r.officialGames), finishedAt:r.finishedAt||Date.now()
        };
        changed=true;
      }
    }

    // バドるの「棄権」ボタンで試合途中に棄権した選手は、以後の全ての未実施試合も
    // 自動的に不戦敗とするため、大会全体の棄権登録にも加える
    if(isDecisive && r.retired && r.retiredSide){
      var retiredTeam = r.retiredSide==='A' ? r.teamA : r.teamB;
      toArray(retiredTeam).forEach(function(n){
        if(n && !withdrawnPlayers[n]){ withdrawnPlayers[n] = true; changed = true; }
      });
    }

    // 実績ペース算出用：決着がついた試合の所要時間を記録する（リーグ／ブラケット／単発いずれも対象）
    // 大会Nowからコートへ配信した時刻(assignedAt)から終了までを実績所要時間として使う。
    // 待機・選手確認を含めた『コート占有時間』を基準にすることで、後続試合の予測を実運用に合わせる。
    if(isDecisive && c.assignedAt && r.finishedAt){
      var dur = r.finishedAt - c.assignedAt;
      // 棄権試合は通常の試合時間を表さないため、予測学習の母集団から除外する。
      if(!r.retired && dur > 0 && dur < 3*60*60*1000){ // 3時間以上は異常値として除外
        durations.push(dur);
        // 予測に使うのは常に直近20試合。保存側も20件に絞る。
        if(durations.length > 20) durations = durations.slice(durations.length-20);
      }
    }

    if(r.refType==='league' && leagues[r.refId]){
      var lg = Object.assign({}, leagues[r.refId]);
      var matches = toArray(lg.matches).map(function(m,idx){
        if(idx !== r.refMatchIndex) return m;
        if(!isDecisive) return m; // 中止された試合は結果を記録せず、再戦できるようキューへ戻す
        return Object.assign({}, m, { result:{ winner:r.winner, gameWinsA:r.gameWinsA, gameWinsB:r.gameWinsB, pointsA:r.pointsA, pointsB:r.pointsB, gameScores:toArray(r.gameScores||r.officialGames), retired: !!r.retired, retiredSide: r.retiredSide||null } });
      });
      lg.matches = matches;
      leagues[r.refId] = lg;
      if(!isDecisive && r.teamA && r.teamB){
        queue.push({ id:uid(), time:'', matchCode: lg.name+'-'+(r.refMatchIndex+1), matchType: lg.type||'singles',
          teamA:r.teamA, teamB:r.teamB, refType:'league', refId:r.refId, refMatchIndex:r.refMatchIndex });
      }
    }
    if(r.refType==='bracket' && brackets[r.refId]){
      var br = Object.assign({}, brackets[r.refId]);
      br.matches = toArray(br.matches).map(function(m){
        if(m.id !== r.refMatchIndex) return m;
        if(!isDecisive) return m;
        return Object.assign({}, m, { result:{ winner:r.winner, gameWinsA:r.gameWinsA, gameWinsB:r.gameWinsB, pointsA:r.pointsA, pointsB:r.pointsB, gameScores:toArray(r.gameScores||r.officialGames), retired: !!r.retired, retiredSide: r.retiredSide||null } });
      });
      brackets[r.refId] = br;
      if(!isDecisive && r.teamA && r.teamB){
        queue.push({ id:uid(), time:'', matchCode: br.name+'-'+r.refMatchIndex, matchType: (r.teamA.length>1||r.teamB.length>1)?'doubles':'singles',
          teamA:r.teamA, teamB:r.teamB, refType:'bracket', refId:r.refId, refMatchIndex:r.refMatchIndex });
      }
    }
    // refTypeの有無に関わらず、処理済みマークを付ける（所要時間の重複計上・再処理を防ぐ）
    newCourts[key] = Object.assign({}, c, { lastResult: Object.assign({}, r, { applied:true }) });
    changed = true;
  });

  if(!changed) return data;
  return Object.assign({}, data, { leagues:leagues, brackets:brackets, courts:newCourts, queue:queue, matchDurations:durations, withdrawnPlayers:withdrawnPlayers, completedMatches:completedMatches });
}

/* ══ ②ブラケットのスロットが揃った試合をキューへ投入 ══ */
function resolveBracketsIntoQueue(data){
  var brackets = data.brackets || {};
  var queue = toArray(data.queue).slice();
  var changed = false;
  var newBrackets = {};
  Object.keys(brackets).forEach(function(bid){
    var br = brackets[bid];
    var matches = toArray(br.matches).map(function(m){
      if(m.teamA && m.teamB) return m;
      var a = resolveSlotRef(data, m.slotA);
      var b = resolveSlotRef(data, m.slotB);
      if(a && b){
        if(!m.queued){
          changed = true;
          queue.push({
            id: uid(), time:m.time||'', matchCode: m.matchCode || (br.name+'-'+m.id),
            matchType: (a.filter(Boolean).length>1 || b.filter(Boolean).length>1) ? 'doubles':'singles',
            teamA:a, teamB:b, refType:'bracket', refId:bid, refMatchIndex:m.id
          });
        }
        return Object.assign({}, m, { teamA:a, teamB:b, queued:true });
      }
      return m;
    });
    newBrackets[bid] = Object.assign({}, br, { matches:matches });
  });
  if(!changed) return data;
  return Object.assign({}, data, { brackets:newBrackets, queue:queue });
}

/* ══ ③空きコートへキュー先頭を割当（従来ロジック） ══ */
/* 既に他コートで「配信済み・進行中」の選手名一覧を集める（同時出場の重複防止用） */
function playingTeamNames(courts){
  var playing = {};
  Object.keys(courts||{}).forEach(function(cno){
    var c = courts[cno];
    if(c && c.match && (c.status==='assigned' || c.status==='live')){
      toArray(c.match.teamA).concat(toArray(c.match.teamB)).forEach(function(n){ if(n) playing[n]=true; });
    }
  });
  return playing;
}

function assignIdleCourts(data){
  var courtCount=data.courtCount||0;
  var queue=toArray(data.queue).slice();
  var courts=Object.assign({},data.courts||{});
  var changed=false;
  var playing = playingTeamNames(courts);

  // 表示上の「予測時刻の早い順」と実際の配信順を一致させるため、
  // 配信候補を探す際は時刻でソートしたビューを使う（キューの格納順そのものは変えない）
  function sortedView(){
    return queue.slice().sort(function(a,b){
      var ma=timeToMinutes(a.time), mb=timeToMinutes(b.time);
      if(ma===null && mb===null) return 0;
      if(ma===null) return 1;
      if(mb===null) return -1;
      return ma-mb;
    });
  }

  for(var i=1;i<=courtCount;i++){
    var key=String(i);
    var court=courts[key]||{status:'idle',match:null,live:null,lastResult:null};
    if(court.status!=='idle' || queue.length===0) continue;
    // 時刻の早い順に、出場者が誰も他コートと重複しない最初の試合を探す
    // （同じ時間帯に同じ選手が複数コートで同時に試合することを防ぐ）
    var view = sortedView();
    var picked = null;
    for(var qi=0; qi<view.length; qi++){
      var names = toArray(view[qi].teamA).concat(toArray(view[qi].teamB));
      var conflict = names.some(function(n){ return n && playing[n]; });
      if(!conflict){ picked = view[qi]; break; }
    }
    if(!picked) continue; // 割り当てられる試合が無い（残り全て出場者が重複）
    var idx = queue.indexOf(picked);
    if(idx === -1) continue;
    queue.splice(idx,1);
    courts[key]=Object.assign({},court,{status:'assigned',match:picked,live:null,assignedAt:Date.now()});
    changed=true;
    toArray(picked.teamA).concat(toArray(picked.teamB)).forEach(function(n){ if(n) playing[n]=true; });
  }
  if(!changed)return data;
  return Object.assign({},data,{queue:queue,courts:courts});
}

/* ══ 自動配信ロジック本体（3段パイプライン。テスト容易にするため純関数化） ══
   data: {courtCount, queue, courts, leagues, brackets}
   戻り値: 変更後の data（変更が無ければ同一参照を返す） */
/* ══ 棄権（不戦敗）の自動反映 ══
   data.withdrawnPlayers = { "選手名": true, ... } に登録された選手が含まれる、
   まだ結果の出ていない試合（キュー・リーグ・ブラケット）を、相手側の不戦勝として自動的に決着させる。
   両者とも棄権者を含む場合は判定不能のため、そのまま残す（本部が手動対応）。 */
function makeWalkoverResult(winnerSide, data){
  var rules = Object.assign({format:'best3',points:21}, (data&&data.matchRules)||{});
  var mode = (data&&data.walkoverRule) || 'A';
  var gamesToWin = rules.format==='single' ? 1 : 2;
  var total = (Number(rules.points)||21) * gamesToWin;
  // A: 補完スコア方式（標準） / B: 勝敗のみ（得失ゲーム・得失点に算入しない）
  return { winner:winnerSide,
    gameWinsA:mode==='A'?(winnerSide==='A'?gamesToWin:0):0,
    gameWinsB:mode==='A'?(winnerSide==='B'?gamesToWin:0):0,
    pointsA:mode==='A'?(winnerSide==='A'?total:0):0,
    pointsB:mode==='A'?(winnerSide==='B'?total:0):0,
    excludeGamePoint: mode==='B', retired:true, retiredSide:winnerSide==='A'?'B':'A', walkover:true, walkoverRule:mode };
}
function teamHasWithdrawn(team, withdrawn){
  return toArray(team).some(function(n){ return n && withdrawn[n]; });
}

function applyWithdrawals(data){
  var withdrawn = data.withdrawnPlayers || {};
  if(Object.keys(withdrawn).length === 0) return data;

  var changed = false;
  var leagues = Object.assign({}, data.leagues||{});
  var brackets = Object.assign({}, data.brackets||{});
  var courts = data.courts || {};

  function isBeingPlayed(refType, refId, refMatchIndex){
    return Object.keys(courts).some(function(cno){
      var c = courts[cno];
      return c && c.match && c.match.refType===refType && c.match.refId===refId && c.match.refMatchIndex===refMatchIndex && (c.status==='assigned'||c.status==='live');
    });
  }

  Object.keys(leagues).forEach(function(lid){
    var lg = leagues[lid];
    var newMatches = toArray(lg.matches).map(function(m){
      var a = lg.participants[m.i]||[], b = lg.participants[m.j]||[];
      var aOut = teamHasWithdrawn(a, withdrawn), bOut = teamHasWithdrawn(b, withdrawn);
      // C: 大会離脱者が含まれるリーグ戦は、実施済みを含め順位計算から除外する。
      if((data.walkoverRule||'A')==='C' && (aOut || bOut)){
        if(!m.result || !m.result.voided){ changed=true; return Object.assign({}, m, {result:{voided:true, walkover:true, walkoverRule:'C'}}); }
        return m;
      }
      if(m.result || isBeingPlayed('league', lid, m.id)) return m;
      if(aOut && !bOut){ changed=true; return Object.assign({}, m, { result: makeWalkoverResult('B', data) }); }
      if(bOut && !aOut){ changed=true; return Object.assign({}, m, { result: makeWalkoverResult('A', data) }); }
      return m;
    });
    if(newMatches !== lg.matches){ leagues[lid] = Object.assign({}, lg, { matches: newMatches }); }
  });

  Object.keys(brackets).forEach(function(bid){
    var br = brackets[bid];
    var newMatches = toArray(br.matches).map(function(m){
      if(m.result || isBeingPlayed('bracket', bid, m.id)) return m;
      var a = m.teamA || resolveSlotRef(data, m.slotA);
      var b = m.teamB || resolveSlotRef(data, m.slotB);
      if(!a || !b) return m; // まだ両方の対戦相手が確定していない
      var aOut = teamHasWithdrawn(a, withdrawn), bOut = teamHasWithdrawn(b, withdrawn);
      if(aOut && !bOut){ changed=true; return Object.assign({}, m, { teamA:a, teamB:b, result: makeWalkoverResult('B', data) }); }
      if(bOut && !aOut){ changed=true; return Object.assign({}, m, { teamA:a, teamB:b, result: makeWalkoverResult('A', data) }); }
      return m;
    });
    if(newMatches !== br.matches){ brackets[bid] = Object.assign({}, br, { matches: newMatches }); }
  });

  // キューに残っている（まだリーグ/ブラケットに未反映、あるいは単発の）試合のうち、
  // 片方だけが棄権者を含むものは配信対象から除外する
  var queue = toArray(data.queue).filter(function(item){
    var aOut = teamHasWithdrawn(item.teamA, withdrawn), bOut = teamHasWithdrawn(item.teamB, withdrawn);
    if(aOut !== bOut){ changed = true; return false; } // 除外
    return true;
  });

  if(!changed) return data;
  return Object.assign({}, data, { leagues:leagues, brackets:brackets, queue:queue });
}

function computeDispatch(data){
  if(!data)return data;
  var d1 = applyPendingResults(data);
  var d1b = applyWithdrawals(d1);
  var d2 = resolveBracketsIntoQueue(d1b);
  // コートへの配信は大会運営者がコート状況画面の『配信』ボタンで行う。
  // 結果反映・棄権処理・ブラケット解決までは自動、コート割当は手動。
  return d2;
}

/* ══ 管理者クライアントでのディスパッチ監視 ══
   同時に複数の管理端末が開いていても安全なようtransactionで適用 */
function watchAndDispatch(eventId){
  var ref=dbRef(eventId);
  var h=ref.on('value',function(snap){
    var data=snap.val();
    if(!data)return;
    var next=computeDispatch(data);
    if(next!==data){
      ref.transaction(function(cur){
        if(!cur)return cur;
        return computeDispatch(cur);
      });
    }
  });
  _listeners.push({ref:ref,h:h});
}


/* ══ localStorage: 作成した大会の一覧（管理者が後で戻れるように） ══ */
/* ══ 進行状況のエクスポート／インポート ══
   リーグ・ブラケット・キュー・コート状況をすべて含む1枚のCSVとして書き出し／読み込みする */
var EXPORT_HEADER = ['section','groupName','matchIndex','round','matchCode','time','type',
  'teamA1','teamA2','teamB1','teamB2','slotAType','slotAValue','slotBType','slotBValue',
  'status','courtNo','winner','gameWinsA','gameWinsB','pointsA','pointsB','gameScores'];

function csvCell(v){
  v = (v===null||v===undefined) ? '' : String(v);
  return (v.indexOf(',')>=0 || v.indexOf('"')>=0) ? '"'+v.replace(/"/g,'""')+'"' : v;
}
function slotToTypeValue(data, ref){
  if(!ref) return ['',''];
  if(ref.type==='fixed') return ['fixed', (ref.names||[]).join('・')];
  if(ref.type==='leagueRank'){
    var lg = (data.leagues||{})[ref.leagueId];
    return ['leagueRank', (lg?lg.name:ref.leagueId)+':'+ref.rank];
  }
  if(ref.type==='matchWinner'){
    var br = (data.brackets||{})[ref.bracketId];
    return ['matchWinner', (br?br.name:ref.bracketId)+':'+ref.matchId];
  }
  if(ref.type==='matchWinnerCode') return ['matchWinnerCode', ref.matchCode||''];
  return ['',''];
}

function findCourtFor(data, refType, refId, refMatchIndex){
  var courts = data.courts || {};
  var found = null;
  Object.keys(courts).forEach(function(cno){
    var c = courts[cno];
    if(c && c.match && c.match.refType===refType && c.match.refId===refId && c.match.refMatchIndex===refMatchIndex){
      found = cno;
    }
  });
  return found;
}

function exportProgressCsv(data){
  var rows = [EXPORT_HEADER];
  var leagues = data.leagues || {};
  Object.keys(leagues).forEach(function(lid){
    var lg = leagues[lid];
    toArray(lg.matches).forEach(function(m){
      var a = lg.participants[m.i]||[], b = lg.participants[m.j]||[];
      var courtNo = m.result ? '' : findCourtFor(data, 'league', lid, m.id);
      var status = m.result ? 'done' : (courtNo ? 'court' : 'pending');
      rows.push(['league', lg.name, m.id, '', '', '', lg.type||'singles',
        a[0]||'',a[1]||'', b[0]||'',b[1]||'', '','','','',
        status, courtNo||'', m.result?m.result.winner:'', m.result?m.result.gameWinsA:'', m.result?m.result.gameWinsB:'',
        m.result?m.result.pointsA:'', m.result?m.result.pointsB:'', m.result&&m.result.gameScores?JSON.stringify(m.result.gameScores):'']);
    });
  });
  var brackets = data.brackets || {};
  Object.keys(brackets).forEach(function(bid){
    var br = brackets[bid];
    toArray(br.matches).forEach(function(m){
      var sa = slotToTypeValue(data, m.slotA), sb = slotToTypeValue(data, m.slotB);
      var a = m.teamA||[], b = m.teamB||[];
      var courtNo = m.result ? '' : findCourtFor(data, 'bracket', bid, m.id);
      var status = m.result ? 'done' : (courtNo ? 'court' : 'pending');
      rows.push(['bracket', br.name, m.id, m.round||1, m.matchCode||'', m.time||'', (a.length>1||b.length>1)?'doubles':'singles',
        a[0]||'',a[1]||'', b[0]||'',b[1]||'', sa[0],sa[1],sb[0],sb[1],
        status, courtNo||'', m.result?m.result.winner:'', m.result?m.result.gameWinsA:'', m.result?m.result.gameWinsB:'',
        m.result?m.result.pointsA:'', m.result?m.result.pointsB:'', m.result&&m.result.gameScores?JSON.stringify(m.result.gameScores):'']);
    });
  });
  // 「リーグ／ブラケットに属さない試合」で、既にコートに割り当て済みのものは
  // 上のループで courtNo が付いて出力済みなので、courts側では二重に出力しない。
  var courts = data.courts || {};
  var alreadyExported = {};
  Object.keys(courts).forEach(function(cno){
    var c = courts[cno];
    if(c && c.match && (c.match.refType==='league' || c.match.refType==='bracket')){
      alreadyExported[cno] = true;
    }
  });
  toArray(data.queue).forEach(function(m){
    if(m.refType==='league' || m.refType==='bracket') return; // リーグ／ブラケット側の行で出力済み扱いにするため重複させない
    rows.push(['queue','', '', '', m.matchCode||'', m.time||'', m.matchType||'singles',
      (m.teamA||[])[0]||'', (m.teamA||[])[1]||'', (m.teamB||[])[0]||'', (m.teamB||[])[1]||'',
      '','','','', 'pending', '', '','','','','']);
  });
  Object.keys(courts).forEach(function(cno){
    var c = courts[cno];
    if(c && c.match && !alreadyExported[cno]){
      rows.push(['queue','', '', '', c.match.matchCode||'', c.match.time||'', c.match.matchType||'singles',
        (c.match.teamA||[])[0]||'', (c.match.teamA||[])[1]||'', (c.match.teamB||[])[0]||'', (c.match.teamB||[])[1]||'',
        '','','','', 'court', cno, '','','','','']);
    }
  });
  return rows.map(function(r){ return r.map(csvCell).join(','); }).join('\n');
}


function parseGameScoresCsv(v){
  if(!v) return [];
  try{ var a=JSON.parse(v); return Array.isArray(a)?a:[]; }catch(e){ return []; }
}

function parseProgressCsv(text){
  var lines = text.split(/\r?\n/).map(function(l){return l;}).filter(function(l){return l.trim()!=='';});
  var rows = lines.slice(1).map(function(line){
    // 簡易CSVパース（ダブルクォート対応）
    var cells=[]; var cur=''; var inQ=false;
    for(var i=0;i<line.length;i++){
      var ch=line[i];
      if(inQ){
        if(ch==='"'){ if(line[i+1]==='"'){cur+='"'; i++;} else inQ=false; }
        else cur+=ch;
      }else{
        if(ch==='"') inQ=true;
        else if(ch===','){ cells.push(cur); cur=''; }
        else cur+=ch;
      }
    }
    cells.push(cur);
    var o = {};
    EXPORT_HEADER.forEach(function(h,idx){ o[h]=cells[idx]!==undefined?cells[idx]:''; });
    return o;
  });

  var leagues = {};
  var brackets = {};
  var queue = [];
  var courts = {};

  var leagueRows = rows.filter(function(r){return r.section==='league';});
  var leagueGroups = {};
  leagueRows.forEach(function(r){ leagueGroups[r.groupName]=leagueGroups[r.groupName]||[]; leagueGroups[r.groupName].push(r); });
  var leagueNameToId = {};
  Object.keys(leagueGroups).forEach(function(name){
    var lid = uid();
    leagueNameToId[name] = lid;
    var grows = leagueGroups[name].sort(function(a,b){return Number(a.matchIndex)-Number(b.matchIndex);});
    var participants = []; var pairIndex = {};
    function idxOf(a1,a2){
      var key = a1+'|'+a2;
      if(pairIndex[key]===undefined){ pairIndex[key]=participants.length; participants.push([a1,a2].filter(Boolean)); }
      return pairIndex[key];
    }
    var matches = grows.map(function(r){
      var i = idxOf(r.teamA1, r.teamA2);
      var j = idxOf(r.teamB1, r.teamB2);
      var result = r.status==='done' ? { winner:r.winner, gameWinsA:Number(r.gameWinsA)||0, gameWinsB:Number(r.gameWinsB)||0, pointsA:Number(r.pointsA)||0, pointsB:Number(r.pointsB)||0, gameScores:parseGameScoresCsv(r.gameScores) } : null;
      return { id:Number(r.matchIndex)||0, i:i, j:j, result:result, _status:r.status, _courtNo:r.courtNo };
    });
    leagues[lid] = { id:lid, name:name, type: (grows[0]&&grows[0].type)||'singles', participants:participants,
      matches: matches.map(function(m){ return { id:m.id, i:m.i, j:m.j, result:m.result }; }) };
    // 未実施でコート未割当の試合はキューへ、コート割当中の試合は該当コートへ復元
    matches.forEach(function(m){
      if(m.result) return;
      var item = {
        id: uid(), time:'', matchCode: name+'-'+(m.id+1), matchType: leagues[lid].type,
        teamA: leagues[lid].participants[m.i], teamB: leagues[lid].participants[m.j],
        refType:'league', refId:lid, refMatchIndex:m.id
      };
      if(m._status==='court' && m._courtNo){
        courts[m._courtNo] = { status:'assigned', match:item, live:null, lastResult:null, assignedAt:Date.now() };
      }else{
        queue.push(item);
      }
    });
  });

  var bracketRows = rows.filter(function(r){return r.section==='bracket';});
  var bracketGroups = {};
  bracketRows.forEach(function(r){ bracketGroups[r.groupName]=bracketGroups[r.groupName]||[]; bracketGroups[r.groupName].push(r); });
  var bracketNameToId = {};
  Object.keys(bracketGroups).forEach(function(name){ bracketNameToId[name]=uid(); });
  function parseSlot(type, value){
    if(!type) return null;
    if(type==='fixed') return { type:'fixed', names: value.split('・').map(function(s){return s.trim();}).filter(Boolean) };
    if(type==='leagueRank'){
      var parts = value.split(':'); 
      var lid = leagueNameToId[parts[0]] || parts[0];
      return { type:'leagueRank', leagueId: lid, rank: Number(parts[1])||1 };
    }
    if(type==='matchWinner'){
      var p2 = value.split(':');
      var bid = bracketNameToId[p2[0]] || p2[0];
      return { type:'matchWinner', bracketId: bid, matchId: Number(p2[1])||0 };
    }
    if(type==='matchWinnerCode') return {type:'matchWinnerCode', matchCode:value};
    return null;
  }
  Object.keys(bracketGroups).forEach(function(name){
    var bid = bracketNameToId[name];
    var grows = bracketGroups[name].sort(function(a,b){return Number(a.matchIndex)-Number(b.matchIndex);});
    var matches = grows.map(function(r){
      var teamA = (r.teamA1||r.teamA2) ? [r.teamA1,r.teamA2].filter(Boolean) : null;
      var teamB = (r.teamB1||r.teamB2) ? [r.teamB1,r.teamB2].filter(Boolean) : null;
      var result = r.status==='done' ? { winner:r.winner, gameWinsA:Number(r.gameWinsA)||0, gameWinsB:Number(r.gameWinsB)||0, pointsA:Number(r.pointsA)||0, pointsB:Number(r.pointsB)||0, gameScores:parseGameScoresCsv(r.gameScores) } : null;
      var queuedAlready = !!(teamA && teamB && (r.status==='court' || r.status==='pending'));
      return {
        id:Number(r.matchIndex)||0, matchCode:r.matchCode||'', time:r.time||'', round:Number(r.round)||1,
        slotA: parseSlot(r.slotAType, r.slotAValue), slotB: parseSlot(r.slotBType, r.slotBValue),
        teamA: teamA, teamB: teamB, queued: queuedAlready, result: result,
        _status:r.status, _courtNo:r.courtNo
      };
    });
    brackets[bid] = { id:bid, name:name, matches: matches.map(function(m){
      return { id:m.id, matchCode:m.matchCode||'', time:m.time||'', round:m.round, slotA:m.slotA, slotB:m.slotB, teamA:m.teamA, teamB:m.teamB, queued:m.queued, result:m.result };
    }) };
    // 両者確定済みだが未実施の試合は、キューまたはコートへ復元する
    matches.forEach(function(m){
      if(m.result || !m.teamA || !m.teamB) return;
      var item = {
        id: uid(), time:'', matchCode: name+'-'+m.id, matchType: (m.teamA.length>1||m.teamB.length>1)?'doubles':'singles',
        teamA:m.teamA, teamB:m.teamB, refType:'bracket', refId:bid, refMatchIndex:m.id
      };
      if(m._status==='court' && m._courtNo){
        courts[m._courtNo] = { status:'assigned', match:item, live:null, lastResult:null, assignedAt:Date.now() };
      }else{
        queue.push(item);
      }
    });
  });

  rows.filter(function(r){return r.section==='queue';}).forEach(function(r){
    var item = {
      id: uid(), time:r.time, matchCode:r.matchCode, matchType:r.type||'singles',
      teamA:[r.teamA1,r.teamA2].filter(Boolean), teamB:[r.teamB1,r.teamB2].filter(Boolean)
    };
    if(r.status==='court' && r.courtNo){
      courts[r.courtNo] = { status:'assigned', match:item, live:null, lastResult:null, assignedAt:Date.now() };
    }else{
      queue.push(item);
    }
  });

  return { leagues:leagues, brackets:brackets, queue:queue, courts:courts };
}

function downloadTextFile(filename, text){
  var blob = new Blob(["\uFEFF"+text], {type:'text/csv;charset=utf-8;'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href=url; a.download=filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

    'リーグ戦の結果から順位を決め、各リーグ1位が決勝へ進みます。最終結果まで自動反映される流れを確認してください。',

  ];

}
function demoFinishOne(cur){
  cur=applyPendingResults(cur); cur=resolveBracketsIntoQueue(cur);
  var q=toArray(cur.queue), m=q[0]; if(!m)return cur;
  var result={winner:'A',gameWinsA:2,gameWinsB:0,pointsA:42,pointsB:29,gameScores:[{a:21,b:14},{a:21,b:15}]};
  if(m.refType==='league' && cur.leagues && cur.leagues[m.refId]){
    var lg=cur.leagues[m.refId], ms=toArray(lg.matches);
    ms=ms.map(function(x,idx){return idx===m.refMatchIndex?Object.assign({},x,{result:result}):x;});
    cur.leagues[m.refId]=Object.assign({},lg,{matches:ms});
  }else if(m.refType==='bracket' && cur.brackets && cur.brackets[m.refId]){
    var br=cur.brackets[m.refId]; br.matches=toArray(br.matches).map(function(x){return x.id===m.refMatchIndex?Object.assign({},x,{teamA:m.teamA,teamB:m.teamB,result:result}):x;}); cur.brackets[m.refId]=br;
  }
  cur.completedMatches=cur.completedMatches||{};
  cur.completedMatches[m.matchCode]={matchCode:m.matchCode,winner:'A',winnerTeam:m.teamA,teamA:m.teamA,teamB:m.teamB,gameWinsA:2,gameWinsB:0,pointsA:42,pointsB:29,gameScores:result.gameScores,finishedAt:Date.now()};
  cur.queue=q.slice(1); return resolveBracketsIntoQueue(cur);
}
function advanceDemo(eventId){
  var nextTab=null;
  dbRef(eventId).transaction(function(cur){
    if(!cur || !cur.demoMode)return cur;
    var step=Number(cur.demoStep||0);
    if(step===0){cur.demoStep=1;nextTab='courts';return cur;}
    if(step===1){cur.demoStep=2;nextTab='courts';return cur;}
    if(step===2){cur.demoStep=3;return cur;}
    if(step===3){
      var courts=Object.assign({},cur.courts||{}), c=courts['1'];
      if(c&&c.match){
        var m=c.match, result={winner:'A',gameWinsA:2,gameWinsB:0,pointsA:42,pointsB:29,gameScores:[{a:21,b:14},{a:21,b:15}]};
        cur.pendingResults=cur.pendingResults||{}; cur.pendingResults['demo_'+Date.now()]={courtNo:1,match:m,result:result,finishedAt:Date.now()};
        courts['1']=Object.assign({},c,{status:'idle',match:null,live:null,lastResult:result,finishedAt:Date.now()});cur.courts=courts;
      }
      cur=applyPendingResults(cur);cur=resolveBracketsIntoQueue(cur);cur.demoStep=4;nextTab='courts';return cur;
    }
    if(step===4){cur.demoStep=5;nextTab='tournament';return cur;}
    if(step===5){cur.demoStep=6;nextTab='withdrawal';return cur;}
    if(step===6){cur.demoStep=7;nextTab='settings';return cur;}
    if(step===7){
      var guard=20;while(guard--){var before=toArray(cur.queue).length;cur=demoFinishOne(cur);if(toArray(cur.queue).length===before)break;}
      cur.demoStep=8;nextTab='tournament';return cur;
    }
    if(step===8){cur.demoStep=9;nextTab='tournament';return cur;}
    return cur;
  },function(err,committed,snap){
    if(err)return;
    var d=snap&&snap.val?snap.val():null;
    if(d && Number(d.demoStep)===2){
      dispatchNextToCourt(eventId,1).then(function(){ activeTab='courts'; });
    }
    if(nextTab)activeTab=nextTab;
  });
}
function endDemo(eventId){
  if(!confirm('デモを終了しますか？\nデモ用データは削除されます。')) return;
  dbOff(); dbRef(eventId).remove(function(){try{sessionStorage.removeItem(DEMO_SESSION_KEY);}catch(e){} location.hash=''; mountSetup();});
}
function buildDemoGuide(eventId,data){
  var step=Number(data.demoStep||0), box=el('div',{className:'demo-guide'});
  box.appendChild(el('div',{className:'demo-guide-title'},'デモ '+(Math.min(step+1,10))+' / 10'));
  box.appendChild(el('div',{className:'demo-guide-text'},demoProgressText(data)));
  var acts=el('div',{className:'demo-guide-actions'});
  var label=step>=9?'もう一度見る':(step===2?'バドるを見る':'デモを進める');
  var next=el('button',{className:'btn btn-primary',type:'button'},label);
  next.onclick=function(){if(step>=9){dbRef(eventId).child('demoStep').set(0);activeTab='courts';}else advanceDemo(eventId);};
  var end=el('button',{className:'btn',type:'button'},'デモ終了');end.onclick=function(){endDemo(eventId);};
  acts.appendChild(next);acts.appendChild(end);box.appendChild(acts);return box;
}
function buildDemoBadoruStage(eventId,data){
  if(!data.demoMode || Number(data.demoStep||0)!==3)return null;
  var base=(data.badoruBaseUrl||DEFAULT_BADORU_URL).replace(/\/?$/,'/');
  var url=base+'?taikaEvent='+encodeURIComponent(eventId)+'&court=1&fullscreen=1';
  var stage=el('div',{className:'demo-badoru-stage'});
  var head=el('div',{className:'demo-badoru-head'});
  head.appendChild(el('div',{},[el('strong',{},'バドる連携デモ'),el('span',{style:{display:'block'}},'大会Nowから配信されたコート1の試合を表示しています')]));
  var btn=el('button',{className:'demo-badoru-next',type:'button'},'採点完了 → 大会Nowへ');btn.onclick=function(){advanceDemo(eventId);};head.appendChild(btn);
  stage.appendChild(head);stage.appendChild(el('iframe',{className:'demo-badoru-frame',src:url,allow:'fullscreen'}));return stage;
}

function teamLabel(team){return (team||[]).filter(Boolean).join(' / ')||'（未定）';}
function buildPlayerClubsFromRows(rows){
  var map={};
  (rows||[]).forEach(function(r){
    [[r.a1,r.a1Club],[r.a2,r.a2Club],[r.b1,r.b1Club],[r.b2,r.b2Club]].forEach(function(x){
      var n=(x[0]||'').trim(), c=(x[1]||'').trim();
      if(n && n.charAt(0)!=='#' && c) map[n]=c;
    });
  });
  return map;
}
function playerLabelWithClub(name, clubs){
  if(!name)return '';
  var club=clubs&&clubs[name];
  return club ? name+'（'+club+'）' : name;
}
function teamLabelWithClubs(team, clubs){
  var names=(team||[]).filter(Boolean);
  return names.length ? names.map(function(n){return playerLabelWithClub(n,clubs);}).join(' / ') : '（未定）';
}
function fmtScore(live){
  if(!live)return null;
  return live.scoreA+' - '+live.scoreB;
}

function createDemoEvent(){

  var close=el('button',{className:'demo-kami-close',type:'button'},'終了'); close.onclick=function(){overlay.remove();}; head.appendChild(close); overlay.appendChild(head);

function mountSetup(){

  var courtLabel=el('div',{className:'field-label'},'コート数');
  var courtInp=el('input',{className:'field-inp',type:'number',value:'12',min:'1',max:'40'});
  var card2=el('div',{className:'card'},[courtLabel,courtInp]);

  var venueLabel=el('div',{className:'field-label'},'会場（任意・バドるのスコアシートに反映されます）');
  var venueInp=el('input',{className:'field-inp',placeholder:'例：町田市立総合体育館'});

  var csvFile=el('input',{type:'file',accept:'.csv',style:{display:'block',marginTop:'8px'}});
  var csvInfo=el('div',{className:'csv-info',style:{marginTop:'10px'}},[

    el('div',{},'種目は「シングルス」または「ダブルス」。1行目はヘッダーとして無視されます。'),
    el('div',{},'上から順に、空いたコートへ自動的に配信されます。'),
    el('div',{style:{marginTop:'6px'}},[el('b',{},'決勝トーナメントの組み方：'),'選手名の代わりに以下が使えます。']),

    el('div',{},'これらを含む試合コードのグループは、自動的に「決勝トーナメント」として登録され、対戦相手が確定次第キューに入ります。')

  var parsedQueue=[]; var parsedBrackets={}; var parsedPlayerClubs={};
  csvFile.onchange=function(){
    var f=csvFile.files[0];
    if(!f)return;
    if(!nameInp.value.trim()){
      nameInp.value = f.name.replace(/\.[^.]+$/, '');

    readCsvFile(f,function(text){
      var parsed = csvParseMatchesAndBrackets(text);
      parsedQueue = parsed.queue;
      parsedBrackets = parsed.brackets;
      parsedPlayerClubs = buildPlayerClubsFromRows(csvParseRows(text));
      var bracketCount = Object.keys(parsedBrackets).length;
      csvPreview.textContent = parsedQueue.length+'件の試合'
        + (bracketCount>0 ? '、'+bracketCount+'件の決勝トーナメントを読み込みました' : 'を読み込みました')

    });

    dbRef(eventId).set(initial,function(err){
      if(err){errEl.textContent='作成に失敗しました: '+err.message;return;}
      saveEventToList({eventId:eventId,eventName:eventName,createdAt:Date.now()});
      /* CSV内にリーグ候補がある場合は、通常画面より先にリーグ作成画面を開く。

      var leagueDetection = autoDetectLeaguesFromQueue(initial);

      location.hash='admin:'+eventId;
      startAdmin(eventId);
    });
  };

  var pastList=getEventsList();
  var pastWrap=null;
  if(pastList.length>0){
    pastWrap=el('div',{style:{marginTop:'24px'}});

    pastList.forEach(function(ev){
      var row=el('div',{className:'card past-event-card'});
      row.appendChild(el('div',{style:{fontWeight:700}},ev.eventName||'（無題）'));
      row.appendChild(el('div',{style:{fontSize:12,color:'var(--ink3)',marginTop:4}},new Date(ev.createdAt).toLocaleString('ja-JP')));

      var actions=el('div',{className:'past-event-actions'});
      var loadBtn=el('button',{className:'btn primary past-event-load',type:'button'},'読込');
      loadBtn.onclick=function(e){
        e.preventDefault(); e.stopPropagation();

        startAdmin(ev.eventId);
      };
      var delBtn=el('button',{className:'btn past-event-delete',type:'button'},'削除');
      delBtn.onclick=function(e){
        e.preventDefault(); e.stopPropagation();
        deletePastEvent(ev,row);
      };
      actions.appendChild(loadBtn);
      actions.appendChild(delBtn);
      row.appendChild(actions);
      /* カード本体にはクリック処理を持たせない。誤タップで大会が開くのを防ぐ。 */
      pastWrap.appendChild(row);
    });
  }

  wrap.appendChild(card1);wrap.appendChild(card2);wrap.appendChild(card2b);wrap.appendChild(card3);
  wrap.appendChild(errEl);wrap.appendChild(startBtn);wrap.appendChild(demoCard);
  if(pastWrap)wrap.appendChild(pastWrap);

  var root=el('div',{style:{minHeight:'100vh'}});
  var setupHelpBtn = el('button',{className:'appbar-help-btn'},'?');
  setupHelpBtn.onclick = showHelpModal;
  root.appendChild(el('div',{className:'appbar'},[el('span',{className:'appbar-title'},'大会Now'), setupHelpBtn]));
  root.appendChild(wrap);
  render(root);
}

/* ══ 手動配信：運営者がコールするタイミングで空きコートへ次試合を送る ══ */
function dispatchNextToCourt(eventId,courtNo){
  var ref=dbRef(eventId);
  return ref.transaction(function(cur){
    if(!cur)return cur;
    // 配信直前にも結果・棄権・勝ち上がりを最新化するが、自動割当はしない
    var data=resolveBracketsIntoQueue(applyWithdrawals(applyPendingResults(cur)));
    var courts=Object.assign({},data.courts||{});
    var key=String(courtNo);
    var court=courts[key]||{status:'idle',match:null,live:null,lastResult:null};
    if(court.status!=='idle' || court.match)return data;
    var queue=toArray(data.queue).slice();
    if(!queue.length)return data;
    var playing=playingTeamNames(courts);
    // CSV予定時刻の早い試合から、他コートと選手が重複しない試合を選ぶ
    var view=queue.slice().sort(function(a,b){
      var ma=timeToMinutes(a.time),mb=timeToMinutes(b.time);
      if(ma===null&&mb===null)return 0;if(ma===null)return 1;if(mb===null)return -1;return ma-mb;
    });
    var picked=null;
    for(var i=0;i<view.length;i++){
      var names=toArray(view[i].teamA).concat(toArray(view[i].teamB));
      if(!names.some(function(n){return n&&playing[n];})){picked=view[i];break;}
    }
    if(!picked)return data;
    var idx=queue.findIndex(function(q){return q.id===picked.id;});
    if(idx<0)idx=queue.indexOf(picked);
    if(idx<0)return data;
    queue.splice(idx,1);
    // バドる側でも審判が所属チームを確認できるよう、配信データに選手ごとの所属を付与する
    var clubs=data.playerClubs||{};
    picked=Object.assign({},picked,{
      teamAClubs:toArray(picked.teamA).map(function(n){return clubs[n]||'';}),
      teamBClubs:toArray(picked.teamB).map(function(n){return clubs[n]||'';})
    });
    courts[key]=Object.assign({},court,{status:'assigned',match:picked,live:null,assignedAt:Date.now(),startedAt:null});
    return Object.assign({},data,{queue:queue,courts:courts});
  });
}

/* ══ 配信取りやめ：開始前の試合を待機キューへ戻す ══ */
function cancelCourtDispatch(eventId,courtNo){
  var ref=dbRef(eventId);
  return ref.transaction(function(cur){
    if(!cur)return cur;
    var courts=Object.assign({},cur.courts||{});
    var key=String(courtNo);
    var court=courts[key];
    // 進行中の試合は大会Nowから直接取り消さない。
    // バドるで「開始取消」して assigned に戻してから配信を取りやめる。
    if(!court || court.status!=='assigned' || !court.match)return cur;
    var returned=court.match;
    var queue=toArray(cur.queue).slice();
    var rid=returned.id||returned.matchCode||null;
    var exists=queue.some(function(q){
      var qid=q&&(q.id||q.matchCode||null);
      return rid ? qid===rid : JSON.stringify(q)===JSON.stringify(returned);
    });
    if(!exists)queue.push(returned);
    courts[key]=Object.assign({},court,{status:'idle',match:null,live:null,assignedAt:null,startedAt:null,updatedAt:Date.now()});
    return Object.assign({},cur,{queue:queue,courts:courts,updatedAt:Date.now()});
  });
}

/* ══ コート使用終了／再開：終盤に使わないコートを予測・配信対象から外す ══ */
function setCourtActive(eventId,courtNo,active){
  var ref=dbRef(eventId);
  return ref.transaction(function(cur){
    if(!cur)return cur;
    var courts=Object.assign({},cur.courts||{});
    var key=String(courtNo);
    var court=courts[key]||{status:'idle',match:null,live:null,lastResult:null};
    // 試合が入っている最中は使用終了にしない
    if(!active && (court.match || court.status==='live' || court.status==='assigned')) return cur;
    courts[key]=Object.assign({},court,{
      status:active?'idle':'inactive',
      match:null,
      live:null,
      assignedAt:null,
      startedAt:null
    });
    return Object.assign({},cur,{courts:courts});
  });
}

/* ══ コートカード描画 ══ */
function buildCourtCard(courtNo,court,eventId,isAdmin,hasQueue,playerClubs){
  court=court||{status:'idle'};
  var statusClass=court.status==='live'?'live':(court.status==='assigned'?'assigned':(court.status==='inactive'?'inactive':'idle'));
  var statusLabel=court.status==='live'?'進行中':(court.status==='assigned'?'配信済み・開始待ち':(court.status==='inactive'?'使用終了':'空き'));
  var card=el('div',{className:'court-card st-'+statusClass});
  card.appendChild(el('div',{className:'court-no'},'コート '+courtNo));
  var statusChildren=[el('span',{className:'court-dot '+(statusClass==='live'?'live':'')}), statusLabel];
  if(court.status==='live' && court.startedAt){
    var elapsedMs=Math.max(0,Date.now()-court.startedAt);
    var elapsedMin=Math.floor(elapsedMs/60000);
    var elapsedSec=Math.floor((elapsedMs%60000)/1000);
    statusChildren.push(el('span',{className:'court-live-time'},'開始 '+fmtHHMM(court.startedAt)));
    statusChildren.push(el('span',{className:'court-elapsed'},'経過 '+elapsedMin+':'+String(elapsedSec).padStart(2,'0')));
  }
  card.appendChild(el('div',{className:'court-status '+statusClass},statusChildren));
  if(court.status==='inactive'){
    card.appendChild(el('div',{className:'court-idle-msg'},'このコートは配信・予測の対象外です'));
    if(isAdmin){
      var resumeBtn=el('button',{className:'court-resume-btn'},'使用再開');
      resumeBtn.onclick=function(){
        resumeBtn.disabled=true; resumeBtn.textContent='変更中…';
        setCourtActive(eventId,courtNo,true).catch(function(e){console.error(e);alert('コートの使用再開に失敗しました');});
      };
      card.appendChild(resumeBtn);
    }
  }else if(court.status==='idle'||!court.match){
    card.appendChild(el('div',{className:'court-idle-msg'},'次の試合待ち'));
    if(isAdmin){
      var dispatchBtn=el('button',{className:'court-dispatch-btn',disabled:!hasQueue},hasQueue?'配信':'待機中');
      dispatchBtn.onclick=function(){
        dispatchBtn.disabled=true; dispatchBtn.textContent='配信中…';
        dispatchNextToCourt(eventId,courtNo).then(function(){
          // DB更新時はvalue監視で再描画される。更新対象が無かった場合もボタンを復帰させる。
          if(document.body.contains(dispatchBtn)){ dispatchBtn.disabled=false; dispatchBtn.textContent='配信'; }
        }).catch(function(e){console.error(e); if(document.body.contains(dispatchBtn)){dispatchBtn.disabled=false;dispatchBtn.textContent='配信';} alert('配信に失敗しました');});
      };
      card.appendChild(dispatchBtn);
      var stopBtn=el('button',{className:'court-stop-btn'},'このコートの使用を終了');
      stopBtn.onclick=function(){
        if(!confirm('コート '+courtNo+' を使用終了にしますか？\n待機キューの予測計算からも除外されます。'))return;
        stopBtn.disabled=true; stopBtn.textContent='変更中…';
        setCourtActive(eventId,courtNo,false).catch(function(e){console.error(e);alert('コートの使用終了に失敗しました');});
      };
      card.appendChild(stopBtn);
    }
  }else{
    var m=court.match;
    card.appendChild(el('div',{className:'court-teams'},[
      teamLabelWithClubs(m.teamA,playerClubs||{}),el('span',{className:'court-vs'},'vs'),teamLabelWithClubs(m.teamB,playerClubs||{})
    ]));
    if(m.matchCode)card.appendChild(el('div',{className:'court-code'},m.matchCode));
    if(isAdmin && court.status==='assigned'){
      var cancelDispatchBtn=el('button',{className:'court-cancel-dispatch-btn'},'配信取りやめ');
      cancelDispatchBtn.onclick=function(){
        if(!confirm('コート '+courtNo+' への配信を取りやめますか？\nこの試合は待機キューへ戻ります。'))return;
        cancelDispatchBtn.disabled=true; cancelDispatchBtn.textContent='取消中…';
        cancelCourtDispatch(eventId,courtNo).catch(function(e){
          console.error(e); alert('配信の取りやめに失敗しました');
          if(document.body.contains(cancelDispatchBtn)){cancelDispatchBtn.disabled=false;cancelDispatchBtn.textContent='配信取りやめ';}
        });
      };
      card.appendChild(cancelDispatchBtn);
    }
    if(court.status==='live'&&court.live){
      card.appendChild(el('div',{className:'court-score'},fmtScore(court.live)));
      if(typeof court.live.gameWinsA==='number'){
        card.appendChild(el('div',{className:'court-gamewins'},'ゲームカウント '+court.live.gameWinsA+' - '+court.live.gameWinsB));
      }
    }
  }
  return card;
}

  var statByIdx = {};

  var anyLive = false;
  for(var i=0;i<n;i++){
    var tr = el('tr');
    tr.appendChild(el('td',{className:'name-cell'},standingTeam(league.participants[i])));
    for(var j=0;j<n;j++){
      if(i===j){ tr.appendChild(el('td',{className:'self-cell','aria-label':'同一選手・対戦なし'},'')); continue; }
      var m = participantMatchResult(league, i, j);
      if(!m){ tr.appendChild(el('td',{},'')); continue; }
      if(!m.result){
        var courtNo = findCourtFor(data, 'league', league.id, m.id);
        if(courtNo){
          anyLive = true;
          tr.appendChild(el('td',{className:'mark-live'},[el('span',{className:'live-dot'}), 'C'+courtNo]));
        }else{
          tr.appendChild(el('td',{},''));
        }
        continue;
      }
      var iWon = (m.i===i && m.result.winner==='A') || (m.j===i && m.result.winner==='B');
      var resultCell;
      if(m.result.retired){
        var iRetired = (m.i===i && m.result.retiredSide==='A') || (m.j===i && m.result.retiredSide==='B');
        resultCell=el('td',{className:(iRetired?'mark-retired':(iWon?'mark-o':'mark-x'))+' score-detail-trigger',title:'タップして試合詳細を表示'},iRetired?'キ':(iWon?'○':'×'));
      }else{
        resultCell=el('td',{className:(iWon?'mark-o':'mark-x')+' score-detail-trigger',title:'タップして試合詳細を表示'},iWon?'○':'×');
      }
      (function(mm){ resultCell.onclick=function(){ showMatchDetail(league.name+' 試合詳細',league.participants[mm.i],league.participants[mm.j],mm.result); }; })(m);
      tr.appendChild(resultCell);
    }
    var s = statByIdx[i];
    var wl=el('td',{className:s?'mgp-trigger':'',title:s?'タップしてM・G・Pを表示':''}, s ? (s.wins+'-'+s.losses) : '');
    if(s){ (function(team,ss){ wl.onclick=function(){showMgpDetail(team,ss);}; })(league.participants[i],s); }
    tr.appendChild(wl);
    tr.appendChild(el('td',{}, rankByIdx[i] || (st.needsManualTiebreak?'同率':'')));
    table.appendChild(tr);
  }
  var standingScroll=el('div',{className:'standing-scroll'}); standingScroll.appendChild(table); card.appendChild(standingScroll);
  if(anyLive){
    card.appendChild(el('div',{className:'live-legend'},[el('span',{className:'live-dot'}),' 進行中（コート番号を表示）']));
  }

  if(st.needsManualTiebreak && isAdmin){
    var warn = el('div',{className:'tie-warn'},'マッチ勝率・ゲーム率・ポイント率・直接対決でも順位が決まらないため、抽選または運営判断で順位を確定してください。下の欄に順位順で番号をカンマ区切りで入力してください（例: 2,0,1）。');
    var ord = el('input',{className:'field-inp',placeholder:'例: 2,0,1',style:{marginTop:'8px'}});
    var okBtn = el('button',{className:'btn btn-outline',style:{marginTop:'8px'}},'この順位で確定');
    okBtn.onclick=function(){
      var arr = ord.value.split(',').map(function(s){return parseInt(s.trim(),10);});
      if(arr.length!==n || arr.some(function(x){return isNaN(x)||x<0||x>=n;})){ alert('人数分の番号（0〜'+(n-1)+'）をカンマ区切りで入力してください'); return; }
      dbRef(eventId).child('leagues/'+league.id+'/tieOverride').set(arr).then(refreshFn);
    };
    warn.appendChild(el('div',{},[ord, okBtn]));
    card.appendChild(warn);
  }else if(st.needsManualTiebreak){
    card.appendChild(el('div',{className:'tie-warn'},'同率のため本部による順位確定待ちです。'));
  }
  return card;
}

function bracketSlotLabel(data, ref){
  if(!ref) return '(未設定)';
  if(ref.type==='fixed') return teamLabel(ref.names);
  if(ref.type==='leagueRank'){
    var lg = (data.leagues||{})[ref.leagueId];
    return (lg?lg.name:'?')+' '+ref.rank+'位';
  }
  if(ref.type==='matchWinner'){
    var br = (data.brackets||{})[ref.bracketId];
    return (br?br.name:'?')+' 第'+(ref.matchId+1)+'試合 勝者';
  }
  if(ref.type==='matchWinnerCode') return (ref.matchCode||'?')+' 勝者';
  return '?';
}


/* 表示用トーナメント統合
   全日本社会人などではCSVの各行/各段階が別groupNameでも、MS1, MS46, MS207... のような
   試合コードの種目プレフィックス（MS/WS/MD/WD/XD等）が同じものは一つのブラケットとして描く。
   従来の小規模大会で、1つのbracket内に複数試合が入っている場合はその構造を維持する。 */
function tournamentCodePrefix(code){
  var m=/^([A-Za-z]+)(?=\d)/.exec(String(code||'').trim());
  return m ? m[1].toUpperCase() : '';
}
function buildTournamentDisplayGroups(brackets){
  var src=brackets||{}, ids=Object.keys(src);
  if(!ids.length) return [];
  var groups={}, order=[];
  ids.forEach(function(bid){
    var br=src[bid], ms=toArray(br&&br.matches);
    var prefixes={};
    ms.forEach(function(m){ var p=tournamentCodePrefix(m.matchCode); if(p) prefixes[p]=1; });
    var ps=Object.keys(prefixes);
    // コード種別が特定できないものは従来どおりブラケット単位。
    var key=ps.length===1 ? ('code:'+ps[0]) : ('br:'+bid);
    if(!groups[key]){ groups[key]={key:key,prefix:ps.length===1?ps[0]:'',name:br.name,matches:[]}; order.push(key); }
    ms.forEach(function(m){ groups[key].matches.push(m); });
  });
  return order.map(function(key){
    var g=groups[key];
    // 同一コードが重複していた場合は1試合だけにする。
    var seen={}, uniq=[];
    g.matches.forEach(function(m){
      var mk=String(m.matchCode||'') || ('id:'+String(m.id));
      if(seen[mk]) return; seen[mk]=1; uniq.push(m);
    });
    // 1試合しかない既存ブラケットは元名を優先。複数を統合した場合は種目名を見出しにする。
    var names={MS:'男子シングルス',WS:'女子シングルス',MD:'男子ダブルス',WD:'女子ダブルス',XD:'混合ダブルス'};
    var title=(uniq.length>1 && g.prefix) ? (names[g.prefix]||g.prefix)+' トーナメント' : g.name;
    return {id:'display-'+key,name:title,matches:uniq};
  });
}

function buildBracketCard(data, bracket){
  var card = el('div',{className:'league-card tournament-card'});
  card.appendChild(el('h3',{},bracket.name));
  var matches=toArray(bracket.matches);
  var rounds={};
  matches.forEach(function(m){ var r=Number(m.round||1); (rounds[r]=rounds[r]||[]).push(m); });
  var roundKeys=Object.keys(rounds).map(Number).sort(function(a,b){return a-b;});
  if(!roundKeys.length) return card;

  function slotDisplay(ref, team){
    if(team && team.length) return {name:teamLabel(team), origin:ref && ref.type==='leagueRank' ? bracketSlotLabel(data,ref) : ''};
    var resolved=resolveSlotRef(data,ref);
    if(resolved && resolved.length) return {name:teamLabel(resolved), origin:ref && ref.type==='leagueRank' ? bracketSlotLabel(data,ref) : ''};
    return {name:bracketSlotLabel(data,ref), origin:''};
  }

  var scroll=el('div',{className:'tournament-scroll'});
  var tree=el('div',{className:'tournament-tree'});
  var maxGames=Math.max.apply(null,roundKeys.map(function(r){return rounds[r].length;}));
  var minH=Math.max(180,maxGames*104);

  roundKeys.forEach(function(r,ri){
    var col=el('div',{className:'tournament-round-col'});
    var roundName=(ri===roundKeys.length-1 && roundKeys.length>1)?'決勝':(roundKeys.length>2 && ri===roundKeys.length-2?'準決勝':'ROUND '+r);
    col.appendChild(el('div',{className:'tournament-round-title'},roundName));
    var holder=el('div',{className:'tournament-round-matches',style:{minHeight:minH+'px'}});
    var rms=rounds[r].slice().sort(function(a,b){return Number(a.id||0)-Number(b.id||0);});

    // 2試合ずつを一つの枝としてまとめる。縦線＋横線で次ラウンドへの勝ち上がりを可視化する。
    for(var pi=0; pi<rms.length; pi+=2){
      var pairMatches=rms.slice(pi,pi+2);
      var pair=el('div',{className:'tournament-pair'+(ri<roundKeys.length-1?' has-next':'')+(pairMatches.length===2 && pairMatches.every(function(x){return !!x.result;})?' pair-complete':'')});
      pairMatches.forEach(function(m){
        var ad=slotDisplay(m.slotA,m.teamA), bd=slotDisplay(m.slotB,m.teamB);
        var aLabel=ad.name, bLabel=bd.name;
        if(m.result&&m.result.retired){ if(m.result.retiredSide==='A')aLabel+='（キ）'; if(m.result.retiredSide==='B')bLabel+='（キ）'; }
        var game=el('div',{className:'tournament-game'+(ri===roundKeys.length-1?' last-round':'')+(m.result?' progressed score-detail-trigger':''),title:m.result?'タップして試合詳細を表示':'','data-match-code':String(m.matchCode||''),'data-round':String(r)});
        if(m.result){ (function(mm){ game.onclick=function(){showMatchDetail(bracket.name+' 試合詳細',mm.teamA||resolveSlotRef(data,mm.slotA)||[],mm.teamB||resolveSlotRef(data,mm.slotB)||[],mm.result);}; })(m); }
        function teamRow(side,label,disp,hasTeam){
          var won=m.result&&m.result.winner===side;
          var cls='tournament-team'+(won?' winner':'')+(!hasTeam?' pending':'');
          var score='';
          if(m.result){
            if(m.result.voided) score='除';
            else if(m.result.retired && m.result.retiredSide===side) score='キ';
            else score=side==='A'?String(m.result.gameWinsA):String(m.result.gameWinsB);
          }
          var nameBox=el('span',{},label);
          if(disp.origin) nameBox.appendChild(el('small',{className:'tournament-origin'},disp.origin));
          return el('div',{className:cls},[nameBox,el('span',{className:'tournament-team-score'},score)]);
        }
        game.appendChild(teamRow('A',aLabel,ad,!!(m.teamA||resolveSlotRef(data,m.slotA))));
        game.appendChild(teamRow('B',bLabel,bd,!!(m.teamB||resolveSlotRef(data,m.slotB))));
        pair.appendChild(game);
      });
      holder.appendChild(pair);
    }
    col.appendChild(holder); tree.appendChild(col);
  });
  // 実際の #winner:試合コード 参照だけを使って線を描く。
  // これによりシードが途中ラウンドから入っても、無関係な1回戦同士を結ばない。
  var svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('class','tournament-connectors');
  svg.setAttribute('aria-hidden','true');
  tree.insertBefore(svg,tree.firstChild);
  function sourceCode(ref){
    if(!ref) return '';
    if(ref.type==='matchWinnerCode') return String(ref.matchCode||'');
    if(ref.type==='matchWinner'){
      var src=matches.find(function(x){return Number(x.id)===Number(ref.matchId);});
      return src?String(src.matchCode||''):'';
    }
    return '';
  }
  function drawTournamentConnectors(){
    while(svg.firstChild) svg.removeChild(svg.firstChild);
    var tr=tree.getBoundingClientRect();
    if(!tr.width||!tr.height) return;
    svg.setAttribute('viewBox','0 0 '+tr.width+' '+tr.height);
    svg.setAttribute('width',tr.width); svg.setAttribute('height',tr.height);
    matches.forEach(function(target){
      var targetEl=tree.querySelector('[data-match-code="'+CSS.escape(String(target.matchCode||''))+'"]');
      if(!targetEl) return;
      [['A',target.slotA],['B',target.slotB]].forEach(function(pair){
        var code=sourceCode(pair[1]); if(!code) return;
        var sourceEl=tree.querySelector('[data-match-code="'+CSS.escape(code)+'"]'); if(!sourceEl) return;
        var sr=sourceEl.getBoundingClientRect(), dr=targetEl.getBoundingClientRect();
        var x1=sr.right-tr.left, y1=sr.top-tr.top+sr.height/2;
        var x2=dr.left-tr.left, y2=dr.top-tr.top+(pair[0]==='A'?dr.height*.25:dr.height*.75);
        // 直角配線で同じ縦線を共有すると、シードや変則ドローで複数の線が重なり
        // どの試合へ接続しているか判別しにくくなる。各接続を独立した滑らかな曲線で描き、
        // 始点から終点まで一本の線として追えるようにする。
        var dx=Math.max(24,x2-x1);
        var bend=Math.max(18,Math.min(72,dx*.48));
        var c1=x1+bend, c2=x2-bend;
        if(c2<c1){ var mid=(x1+x2)/2; c1=mid; c2=mid; }
        var path=document.createElementNS('http://www.w3.org/2000/svg','path');
        path.setAttribute('d','M '+x1+' '+y1+' C '+c1+' '+y1+', '+c2+' '+y2+', '+x2+' '+y2);
        var progressed=!!sourceEl.classList.contains('progressed');
        path.setAttribute('fill','none'); path.setAttribute('stroke',progressed?'#e22':'#c9c9c5');
        path.setAttribute('stroke-width',progressed?'3':'2');
        path.setAttribute('stroke-linecap','round');
        path.setAttribute('stroke-linejoin','round');
        path.setAttribute('vector-effect','non-scaling-stroke');
        svg.appendChild(path);
      });
    });
  }
  requestAnimationFrame(function(){requestAnimationFrame(drawTournamentConnectors);});
  if(typeof ResizeObserver!=='undefined'){ var ro=new ResizeObserver(drawTournamentConnectors); ro.observe(tree); }
  scroll.appendChild(tree); card.appendChild(scroll);
  return card;
}

/* ══ キューに残っている試合コードから、既存の総当たりブロックを自動検出してリーグ化する ══
   例: A2-A-1, A2-A-2, ... A2-A-6 → グループ名「A2-A」として1つのリーグにまとめる */
function autoDetectLeaguesFromQueue(data){
  var groups = {};
  function collect(item, courtNo){
    if(!item || !item.matchCode) return;
    if(item.refType) return; // 既にリーグ／ブラケットに紐付いている試合は対象外
    var m = /^(.*)-(\d+)$/.exec(item.matchCode);
    if(!m) return;
    var groupName = m[1];
    var num = parseInt(m[2], 10);
    groups[groupName] = groups[groupName] || [];
    groups[groupName].push({ num: num, item: item, courtNo: courtNo || null });
  }
  toArray(data.queue).forEach(function(it){ collect(it, null); });
  Object.keys(data.courts||{}).forEach(function(cno){
    var c = data.courts[cno];
    if(c && c.match) collect(c.match, cno);
  });
  var candidateGroups = Object.keys(groups).filter(function(g){ return groups[g].length >= 2; }).sort();
  return { groups: groups, candidateGroups: candidateGroups };
}

function buildLeaguesFromGroups(data, groupNames){
  var detection = autoDetectLeaguesFromQueue(data);
  var leagues = Object.assign({}, data.leagues||{});
  var queue = toArray(data.queue).slice();
  var courts = Object.assign({}, data.courts||{});

  groupNames.forEach(function(groupName){
    var entries = detection.groups[groupName];
    if(!entries) return;
    entries = entries.slice().sort(function(a,b){ return a.num - b.num; });

    var participants = []; var pairIndex = {};
    function idxOf(team){
      var key = JSON.stringify(team||[]);
      if(pairIndex[key]===undefined){ pairIndex[key]=participants.length; participants.push(team||[]); }
      return pairIndex[key];
    }
    var lid = uid();
    var matches = entries.map(function(e){
      return { id: e.num-1, i: idxOf(e.item.teamA), j: idxOf(e.item.teamB), result: null };
    });
    var type = (entries[0].item.matchType) || 'singles';
    leagues[lid] = { id:lid, name:groupName, type:type, participants:participants, matches:matches };

    entries.forEach(function(e){
      var refInfo = { refType:'league', refId:lid, refMatchIndex: e.num-1 };
      if(e.courtNo){
        courts[e.courtNo] = Object.assign({}, courts[e.courtNo], {
          match: Object.assign({}, courts[e.courtNo].match, refInfo)
        });
      }else{
        var qi = queue.indexOf(e.item);
        if(qi>=0) queue[qi] = Object.assign({}, queue[qi], refInfo);
      }
    });
  });

  return { leagues:leagues, queue:queue, courts:courts };
}

/* リーグ表示順：カスタム順(leagueOrder)があればそれを優先し、
   新しく増えたリーグや順序未設定時はリーグ名のアルファベット順にする */
function orderedLeagueIds(data){
  var leagues = data.leagues || {};
  var ids = Object.keys(leagues);
  function alpha(a,b){ return leagues[a].name.localeCompare(leagues[b].name, 'ja'); }
  var customOrder = data.leagueOrder;
  if(customOrder && Array.isArray(customOrder) && customOrder.length>0){
    var known = {};
    var ordered = customOrder.filter(function(id){ if(leagues[id]){ known[id]=true; return true; } return false; });
    var rest = ids.filter(function(id){ return !known[id]; }).sort(alpha);
    return ordered.concat(rest);
  }
  return ids.sort(alpha);
}

/* ドラッグでの並べ替え（Pointer Eventsでマウス/タッチ両対応） */
function makeReorderable(container, itemSelector, getId, onDone){
  container.querySelectorAll('.drag-handle').forEach(function(handle){
    handle.addEventListener('pointerdown', function(e){
      e.preventDefault();
      var item = handle.closest(itemSelector);
      if(!item) return;
      var dragging = item;
      dragging.classList.add('dragging');
      try{ handle.setPointerCapture(e.pointerId); }catch(err){}

      function onMove(ev){
        var items = Array.prototype.slice.call(container.querySelectorAll(itemSelector));
        var y = ev.clientY;
        for(var i=0;i<items.length;i++){
          if(items[i]===dragging) continue;
          var rect = items[i].getBoundingClientRect();
          var mid = rect.top + rect.height/2;
          if(y < mid){ container.insertBefore(dragging, items[i]); return; }
        }
        container.appendChild(dragging);
      }
      function onUp(ev){
        try{ handle.releasePointerCapture(e.pointerId); }catch(err){}
        dragging.classList.remove('dragging');
        handle.removeEventListener('pointermove', onMove);
        handle.removeEventListener('pointerup', onUp);
        var order = Array.prototype.slice.call(container.querySelectorAll(itemSelector)).map(getId);
        onDone(order);
      }
      handle.addEventListener('pointermove', onMove);
      handle.addEventListener('pointerup', onUp);
    });
  });
}



/* ══ 全試合終了後の大会結果サマリー ══ */
function allTournamentMatchesFinished(data){
  if(toArray(data.queue).length) return false;
  var busy = Object.keys(data.courts||{}).some(function(cno){
    var c=(data.courts||{})[cno];
    return c && c.match && (c.status==='live' || c.status==='assigned');
  });
  if(busy) return false;
  var leaguePending = Object.keys(data.leagues||{}).some(function(lid){
    return toArray(data.leagues[lid].matches).some(function(m){ return !m.result; });
  });
  if(leaguePending) return false;
  var bracketPending = Object.keys(data.brackets||{}).some(function(bid){
    return toArray(data.brackets[bid].matches).some(function(m){ return !m.result; });
  });
  return !bracketPending;
}
function resultTeamFromSide(m, side){ return side==='A' ? (m.teamA||[]) : (m.teamB||[]); }
function bracketPlacings(bracket){
  var matches=toArray(bracket.matches).filter(function(m){return m && m.result && m.teamA && m.teamB;});
  if(!matches.length) return null;
  var maxRound=Math.max.apply(null,matches.map(function(m){return m.round||1;}));
  var finals=matches.filter(function(m){return (m.round||1)===maxRound;});
  if(finals.length!==1) return null;
  var f=finals[0], win=f.result.winner, lose=win==='A'?'B':'A';
  var out={winner:resultTeamFromSide(f,win), runnerUp:resultTeamFromSide(f,lose), thirds:[]};
  var prev=matches.filter(function(m){return (m.round||1)===maxRound-1;});
  if(prev.length===2){
    // 通常の4組決勝T：準決勝敗者2組を同率3位とする。
    prev.forEach(function(m){ var ls=m.result.winner==='A'?'B':'A'; out.thirds.push(resultTeamFromSide(m,ls)); });
  }else if(prev.length===1 && maxRound>1){
    // 3組決勝T（1組が決勝シード）：1回戦の敗者が3位。
    var m=prev[0], ls=m.result.winner==='A'?'B':'A';
    out.thirds.push(resultTeamFromSide(m,ls));
  }
  return out;
}
function leaguePlacings(league){
  var st=computeStandings(league);
  if(st.needsManualTiebreak || !st.ranking || !st.ranking.length) return null;
  var byRank={};
  st.ranking.forEach(function(r){ if(!byRank[r.rank]) byRank[r.rank]=league.participants[r.idx]; });
  return {winner:byRank[1]||[], runnerUp:byRank[2]||[], thirds:byRank[3]?[byRank[3]]:[]};
}

/* 上位入賞者の汎用判定
   - リーグ戦だけで完結するリーグ：そのリーグ最終順位の1～3位を入賞者とする。
   - リーグ戦後に決勝トーナメントがある種目：決勝トーナメント結果を入賞者とする。
   - 2位/3位決定戦などの順位別交流戦は、種目全体の入賞表彰とはみなさない。
   - トーナメント構造上3位が確定しない場合は3位を表示しない。
   CSV固有のAⅠ～F等をハードコードせず、leagueRank参照とトーナメント構造から判定する。 */
function bracketLeagueRankRefs(bracket){
  var refs=[];
  toArray(bracket && bracket.matches).forEach(function(m){
    [m.slotA,m.slotB].forEach(function(slot){
      if(slot && slot.type==='leagueRank') refs.push({leagueId:slot.leagueId, rank:Number(slot.rank||0)});
    });
  });
  return refs;
}
function isChampionshipBracket(bracket){
  if(!bracket) return false;
  var name=String(bracket.name||'');
  // 明示的に「決勝 / final」と付いているものは決勝ステージ。
  if(/決勝|final/i.test(name)) return true;
  var refs=bracketLeagueRankRefs(bracket);
  // 名称に依存しない判定：リーグ1位を集めるトーナメントは決勝ステージとみなす。
  // 2位戦・3位戦などは rank=2/3 なので表彰対象にならない。
  return refs.some(function(r){return r.rank===1;}) && !refs.some(function(r){return r.rank>1;});
}
function cleanAwardTitle(name){
  var s=String(name||'').trim();
  s=s.replace(/\s*(決勝トーナメント|決勝Ｔ|決勝T|決勝)\s*$/i,'').trim();
  return s || String(name||'');
}
function finalAwardSources(data){
  var leagues=data.leagues||{}, brackets=data.brackets||{};
  var out=[];
  var feederLeagueIds={};
  var championship=[];

  // まず「種目全体の決勝ステージ」を構造から抽出する。
  Object.keys(brackets).forEach(function(id){
    var br=brackets[id];
    if(!isChampionshipBracket(br)) return;
    var pl=bracketPlacings(br);
    if(!pl) return;
    championship.push({id:id, bracket:br, placings:pl});
    bracketLeagueRankRefs(br).forEach(function(r){ if(r.leagueId) feederLeagueIds[r.leagueId]=true; });
  });

  // 決勝ステージがある種目は、その結果だけを上位入賞者として表示する。
  championship.forEach(function(x){
    out.push({title:cleanAwardTitle(x.bracket.name), placings:x.placings, sourceType:'bracket'});
  });

  // 決勝ステージへ進まないリーグは、リーグ自体の最終順位を表彰結果とする。
  Object.keys(leagues).forEach(function(id){
    if(feederLeagueIds[id]) return;
    var lg=leagues[id], pl=leaguePlacings(lg);
    if(!pl) return;
    out.push({title:lg.name||'リーグ', placings:pl, sourceType:'league'});
  });

  // 表示順はCSVから作られたリーグの登場順を基準にする。
  // 決勝トーナメントは、その供給元リーグのうち最も早い位置に置く。
  var leagueOrder=orderedLeagueIds(data);
  var leaguePos={}; leagueOrder.forEach(function(id,i){leaguePos[id]=i;});
  out.forEach(function(item){
    if(item.sourceType==='league'){
      var lid=Object.keys(leagues).filter(function(id){return leagues[id] && (leagues[id].name||'リーグ')===item.title;})[0];
      item._displayOrder=(lid!=null && leaguePos[lid]!=null)?leaguePos[lid]:99999;
    }else{
      var src=championship.filter(function(x){return cleanAwardTitle(x.bracket.name)===item.title;})[0];
      var ps=src?bracketLeagueRankRefs(src.bracket).map(function(r){return leaguePos[r.leagueId];}).filter(function(v){return v!=null;}):[];
      item._displayOrder=ps.length?Math.min.apply(null,ps):99999;
    }
  });
  out.sort(function(a,b){ return a._displayOrder-b._displayOrder || String(a.title).localeCompare(String(b.title),'ja',{numeric:true}); });
  return out;
}
function awardTeamEl(team, clubs){
  var box=el('div',{className:'award-team'});

function buildFinalResultsSummary(data){
  var wrap=el('div',{className:'final-results'});
  wrap.appendChild(el('div',{className:'final-results-head'},[
    el('div',{className:'final-results-kicker'},'全試合終了'),

  var awards=el('div',{className:'award-grid'}), count=0;

      card.appendChild(el('div',{className:'award-row'},[el('div',{className:'award-rank'},'3位'),teams]));
    }
    awards.appendChild(card); count++;
  });
  if(count){

    wrap.appendChild(awards);

  wrap.appendChild(el('div',{className:'final-note'},'下に各リーグの勝敗・順位と、決勝トーナメントの全対戦結果を掲載しています。'));
  return wrap;
