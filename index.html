<style>
:root{
  --ink:#111;--ink2:#555;--ink3:#aaa;--rule:#e4e4e4;--bg:#fafaf8;
  --accent:#d63800;--mono:'DM Mono',monospace;
  --sans:'Noto Sans JP',-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif;
  --live:#2e5;--wait:#c80;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:var(--sans);background:var(--bg);min-height:100vh;color:var(--ink)}
button,input,textarea,select{font-family:var(--sans)}
button{cursor:pointer}
button:active{opacity:.75}
input:focus,textarea:focus{outline:none}
#app{min-height:100vh;display:flex;flex-direction:column}

.appbar{background:var(--ink);color:white;padding:13px 18px;font-size:15px;font-weight:300;letter-spacing:.05em;flex-shrink:0;position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between}
.appbar-title{font-size:15px;font-weight:400;color:rgba(255,255,255,.7);letter-spacing:.04em}
.appbar-right{font-family:var(--mono);font-size:15px;color:rgba(255,255,255,.45);letter-spacing:.04em}

.content{flex:1;overflow-y:auto}

.section-title{font-size:14px;font-weight:700;color:var(--ink);margin-bottom:12px;letter-spacing:.03em}
.card{background:white;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:16px 18px;margin-bottom:8px}
.field-label{font-size:12px;color:var(--ink3);margin-bottom:6px;font-weight:400;letter-spacing:.1em;text-transform:uppercase}
.field-inp{width:100%;border:none;border-bottom:1.5px solid var(--rule);background:transparent;padding:10px 0;font-size:18px;color:var(--ink)}
.field-inp:focus{border-bottom-color:var(--ink)}

.btn{border:none;border-radius:4px;font-weight:400;cursor:pointer;letter-spacing:.04em;transition:opacity .1s}
.btn-primary{background:var(--ink);color:white;padding:13px 22px;font-size:15px}
.btn-outline{background:white;border:1px solid var(--ink);color:var(--ink);padding:11px 18px;font-size:14px}
.btn-gray{background:#eee;color:var(--ink2);padding:11px 18px;font-size:14px;border:1px solid var(--rule)}
.btn-danger{background:var(--accent);color:white;padding:11px 18px;font-size:14px}
.btn:disabled{opacity:.4;cursor:default}

/* 設定画面：洗練されたリスト風の行 */
.settings-section{margin:18px 18px 0}
.settings-section-title{font-size:11px;color:var(--ink3);letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px;padding:0 4px}
.settings-list{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.04);border:1px solid var(--rule)}
.settings-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid var(--rule)}
.settings-row:last-child{border-bottom:none}
.settings-row-label{font-size:14px;color:var(--ink);font-weight:400}
.settings-row-sub{font-size:11px;color:var(--ink3);margin-top:2px}
.settings-row-action{flex-shrink:0}
.pill-btn{border:none;background:#f1f0ed;color:var(--ink);font-size:12.5px;padding:8px 14px;border-radius:999px;letter-spacing:.02em;transition:background .12s;cursor:pointer}
.pill-btn:active{background:#e2e0da}
.pill-btn.pill-dark{background:var(--ink);color:#fff}
.pill-btn.pill-dark:active{background:#333}
.pill-btn.pill-danger{background:#fdeae4;color:var(--accent)}
.pill-btn.pill-danger:active{background:#fadad0}
.settings-inp{border:1px solid var(--rule);border-radius:8px;padding:8px 10px;font-size:13px;font-family:var(--mono);width:100%;background:#faf9f7}
.court-link-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 16px;border-bottom:1px solid var(--rule)}
.court-link-row:last-child{border-bottom:none}

  Object.keys(attrs).forEach(function(k){
    if(k==='style')Object.assign(e.style,attrs[k]);
    else if(k.indexOf('on')===0)e[k]=attrs[k];
    else if(k==='className')e.className=attrs[k];

}

/* ══ CSVパース：時刻,試合コード,種目,選手A1,選手A2,選手B1,選手B2[,ラウンド] ══
   選手欄には、決まった相手の代わりに以下の参照記法も使える：
     #league:リーグ名:順位   … 例）#league:A2-A:1  → 「A2-A」というリーグの1位
     #winner:試合番号        … 例）#winner:1        → 同じグループ内の1番目の試合の勝者
   参照記法を含む試合コードのグループ（例: X-1, X-2, X-3）は、
   通常のキュー登録ではなく「ブラケット（勝ち上がり）」として自動的にまとめられる。 */
function csvParseRows(text){
  var lines=text.trim().split('\n').filter(Boolean);
  return lines.slice(1).map(function(line){
    var cols=line.split(',').map(function(s){return s.trim().replace(/^"|"$/g,'');});
    return {
      time:cols[0]||'', code:cols[1]||'',
      type:(cols[2]||'').indexOf('ダブル')>=0?'doubles':'singles',
      a1:cols[3]||'', a2:cols[4]||'', b1:cols[5]||'', b2:cols[6]||'',
      round: parseInt(cols[7],10)||1
    };
  }).filter(function(r){ return r.code || r.a1 || r.b1; });
}

function csvParseMatches(text){
  return csvParseRows(text).map(function(r){
    var teamA=[r.a1];if(r.type==='doubles'&&r.a2)teamA.push(r.a2);
    var teamB=[r.b1];if(r.type==='doubles'&&r.b2)teamB.push(r.b2);
    return{id:uid(),time:r.time,matchCode:r.code,matchType:r.type,teamA:teamA,teamB:teamB};
  });
}

function parseRefOrNames(v1, v2){
  var v = (v1||'').trim();
  if(v.indexOf('#league:')===0){
    var rest = v.slice('#league:'.length);
    var idx = rest.lastIndexOf(':');
    if(idx>0){
      return { ref: { type:'leagueRank', leagueId: rest.slice(0,idx), rank: parseInt(rest.slice(idx+1),10)||1 } };
    }
  }
  if(v.indexOf('#winner:')===0){
    return { ref: { type:'matchWinner', localNum: parseInt(v.slice('#winner:'.length),10)||1 } };
  }
  return { names: [v1, v2].filter(Boolean) };
}

/* CSV全体を「通常のキュー登録行」と「参照記法を含むブラケット」に振り分ける */
function csvParseMatchesAndBrackets(text){
  var rows = csvParseRows(text);
  var groups = {}; var order = [];
  rows.forEach(function(r, i){
    var m = /^(.*)-(\d+)$/.exec(r.code);
    var groupName = m ? m[1] : ('__単独__'+i);
    var num = m ? parseInt(m[2],10) : 1;
    if(!groups[groupName]){ groups[groupName]=[]; order.push(groupName); }
    groups[groupName].push({num:num, row:r});
  });

  var queue = [];
  var brackets = {};

  order.forEach(function(groupName){
    var entries = groups[groupName].slice().sort(function(a,b){return a.num-b.num;});
    var aInfo = entries.map(function(e){ return parseRefOrNames(e.row.a1, e.row.a2); });
    var bInfo = entries.map(function(e){ return parseRefOrNames(e.row.b1, e.row.b2); });
    var hasRef = aInfo.some(function(x){return x.ref;}) || bInfo.some(function(x){return x.ref;});

    if(!hasRef){
      entries.forEach(function(e, idx){
        queue.push({ id:uid(), time:e.row.time, matchCode:e.row.code, matchType:e.row.type,
          teamA:aInfo[idx].names, teamB:bInfo[idx].names });
      });
    }else{
      var bracketId = uid();
      var matches = entries.map(function(e, idx){
        function toSlot(info){
          if(!info.ref) return { type:'fixed', names: info.names };
          if(info.ref.type==='matchWinner') return { type:'matchWinner', bracketId:bracketId, matchId: info.ref.localNum-1 };
          return info.ref; // leagueRank
        }
        return { id: idx, round: e.row.round||1, slotA: toSlot(aInfo[idx]), slotB: toSlot(bInfo[idx]),
          teamA:null, teamB:null, queued:false, result:null };
      });
      brackets[bracketId] = { id:bracketId, name: groupName.indexOf('__単独__')===0 ? ('試合'+(order.indexOf(groupName)+1)) : groupName, matches: matches };
    }
  });

  return { queue: queue, brackets: brackets };
}

function readCsvFile(file,callback){
  var reader=new FileReader();
  reader.onload=function(e){
    var buf=e.target.result,utf8=null;
    try{utf8=new TextDecoder('utf-8',{fatal:true}).decode(buf);}catch(err){utf8=null;}
    if(utf8){callback(utf8);return;}
    try{callback(new TextDecoder('shift-jis').decode(buf));}
    catch(err2){callback(new TextDecoder('utf-8',{fatal:false}).decode(buf));}
  };
  reader.readAsArrayBuffer(file);
}
function toArray(val){
  if(!val)return[];
  if(Array.isArray(val))return val;
  return Object.keys(val).sort(function(a,b){return Number(a)-Number(b);}).map(function(k){return val[k];});
}

/* ══ ラウンドロビン組み合わせパターン ══
   n=3,4,5 は実データの巡回表と一致確認済み。6人以上は一般的な循環法アルゴリズムで
   生成（数学的に正しい総当たりにはなるが、実際の大会要項の番号順とは異なる場合がある） */
function circleMethodPairs(n){
  var arr = []; for(var i=0;i<n;i++) arr.push(i);
  if(n % 2 === 1) arr.push(-1); // 奇数は不戦(bye)を1枠追加
  var m = arr.length;
  var a = arr.slice();
  var flat = [];
  for(var r=0;r<m-1;r++){
    for(var i=0;i<m/2;i++){
      var x=a[i], y=a[m-1-i];
      if(x!==-1 && y!==-1) flat.push([x,y]);
    }
    var last = a.pop(); a.splice(1,0,last);
  }
  return flat;
}
function roundRobinPairs(n){
  if(n===2) return [[0,1]];
  if(n===3) return [[0,1],[0,2],[1,2]];
  if(n===4) return [[0,1],[2,3],[0,2],[1,3],[0,3],[1,2]];
  if(n===5) return [[0,1],[3,4],[0,2],[1,3],[2,4],[0,3],[1,4],[2,3],[0,4],[1,2]];
  return circleMethodPairs(n);
}

/* ══ リーグ（総当たり）の順位計算 ══
   タイブレーク: 勝敗数 → 取得ゲーム率 → 取得ポイント率。
   これらが全て同率の場合は本部の手動確定(tieOverride)に委ねる。 */
function computeStandings(league){
  var n = (league.participants||[]).length;
  var stats = (league.participants||[]).map(function(_, idx){
    return { idx:idx, wins:0, losses:0, gamesWon:0, gamesLost:0, pointsWon:0, pointsLost:0 };
  });
  var matches = toArray(league.matches);
  matches.forEach(function(m){
    if(!m.result) return;
    var a = stats[m.i], b = stats[m.j];
    a.gamesWon += m.result.gameWinsA||0; a.gamesLost += m.result.gameWinsB||0;
    b.gamesWon += m.result.gameWinsB||0; b.gamesLost += m.result.gameWinsA||0;
    a.pointsWon += m.result.pointsA||0; a.pointsLost += m.result.pointsB||0;
    b.pointsWon += m.result.pointsB||0; b.pointsLost += m.result.pointsA||0;
    if(m.result.winner==='A'){ a.wins++; b.losses++; } else { b.wins++; a.losses++; }
  });
  stats.forEach(function(s){
    s.gameRate = (s.gamesWon+s.gamesLost)>0 ? s.gamesWon/(s.gamesWon+s.gamesLost) : 0;
    s.pointRate = (s.pointsWon+s.pointsLost)>0 ? s.pointsWon/(s.pointsWon+s.pointsLost) : 0;
  });
  var allDone = matches.length>0 && matches.every(function(m){ return !!m.result; });
  if(!allDone) return { complete:false, stats:stats };

  if(league.tieOverride && league.tieOverride.length===n){
    var order = league.tieOverride;
    return { complete:true, ranking: order.map(function(idx,i){ return Object.assign({},stats[idx],{rank:i+1}); }) };
  }

  var sorted = stats.slice().sort(function(x,y){
    if(y.wins!==x.wins) return y.wins-x.wins;
    if(y.gameRate!==x.gameRate) return y.gameRate-x.gameRate;
    if(y.pointRate!==x.pointRate) return y.pointRate-x.pointRate;
    return 0;
  });
  var groups = {};
  sorted.forEach(function(s){
    var key = s.wins+'_'+s.gameRate.toFixed(4)+'_'+s.pointRate.toFixed(4);
    groups[key] = groups[key]||[]; groups[key].push(s);
  });
  var hasTie = Object.keys(groups).some(function(k){ return groups[k].length>1; });
  if(hasTie) return { complete:true, needsManualTiebreak:true, stats:sorted };
  return { complete:true, ranking: sorted.map(function(s,i){ return Object.assign({},s,{rank:i+1}); }) };
}

/* ══ ブラケットのスロット参照解決 ══
   ref: {type:'fixed', names} | {type:'leagueRank', leagueId, rank} | {type:'matchWinner', bracketId, matchId} */
function resolveSlotRef(data, ref){
  if(!ref) return null;
  if(ref.type==='fixed') return ref.names;
  if(ref.type==='leagueRank'){
    var lg = (data.leagues||{})[ref.leagueId];
    if(!lg){
      // IDで直接見つからない場合は、リーグ名としても探す
      // （CSVの #league:リーグ名:順位 記法は、リーグがまだ作成されていない段階でも
      //   参照できるよう、IDではなく名前で指定できるようにしているため）
      var byName = Object.keys(data.leagues||{}).map(function(k){ return data.leagues[k]; })
        .filter(function(l){ return l.name===ref.leagueId; })[0];
      lg = byName;
    }
    if(!lg) return null;
    var st = computeStandings(lg);
    if(!st.complete || st.needsManualTiebreak || !st.ranking) return null;
    var entry = st.ranking.filter(function(r){ return r.rank===ref.rank; })[0];
    if(!entry) return null;
    return lg.participants[entry.idx];
  }
  if(ref.type==='matchWinner'){
    var br = (data.brackets||{})[ref.bracketId];
    if(!br) return null;
    var m = toArray(br.matches).filter(function(x){ return x.id===ref.matchId; })[0];
    if(!m || !m.result) return null;
    return m.result.winner==='A' ? m.teamA : m.teamB;
  }
  return null;
}

/* ══ ①バドるから届いた結果をリーグ／ブラケットへ反映 ══ */
function applyPendingResults(data){
  var courts = data.courts || {};
  var leagues = Object.assign({}, data.leagues||{});
  var brackets = Object.assign({}, data.brackets||{});
  var newCourts = Object.assign({}, courts);
  var changed = false;

  Object.keys(courts).forEach(function(key){
    var c = courts[key];
    if(!c || !c.lastResult || c.lastResult.applied) return;
    var r = c.lastResult;
    if(r.refType==='league' && leagues[r.refId]){
      var lg = Object.assign({}, leagues[r.refId]);
      var matches = toArray(lg.matches).map(function(m,idx){
        if(idx !== r.refMatchIndex) return m;
        return Object.assign({}, m, { result:{ winner:r.winner, gameWinsA:r.gameWinsA, gameWinsB:r.gameWinsB, pointsA:r.pointsA, pointsB:r.pointsB } });
      });
      lg.matches = matches;
      leagues[r.refId] = lg;
      changed = true;
    }
    if(r.refType==='bracket' && brackets[r.refId]){
      var br = Object.assign({}, brackets[r.refId]);
      br.matches = toArray(br.matches).map(function(m){
        if(m.id !== r.refMatchIndex) return m;
        return Object.assign({}, m, { result:{ winner:r.winner, gameWinsA:r.gameWinsA, gameWinsB:r.gameWinsB, pointsA:r.pointsA, pointsB:r.pointsB } });
      });
      brackets[r.refId] = br;
      changed = true;
    }
    if(r.refType==='league' || r.refType==='bracket'){
      newCourts[key] = Object.assign({}, c, { lastResult: Object.assign({}, r, { applied:true }) });
    }
  });

  if(!changed) return data;
  return Object.assign({}, data, { leagues:leagues, brackets:brackets, courts:newCourts });
}

/* ══ ②ブラケットのスロットが揃った試合をキューへ投入 ══ */
function resolveBracketsIntoQueue(data){
  var brackets = data.brackets || {};
  var queue = toArray(data.queue).slice();
  var changed = false;
  var newBrackets = {};
  Object.keys(brackets).forEach(function(bid){
    var br = brackets[bid];
    var matches = toArray(br.matches).map(function(m){
      if(m.teamA && m.teamB) return m;
      var a = resolveSlotRef(data, m.slotA);
      var b = resolveSlotRef(data, m.slotB);
      if(a && b){
        if(!m.queued){
          changed = true;
          queue.push({
            id: uid(), time:'', matchCode: br.name+'-'+m.id,
            matchType: (a.filter(Boolean).length>1 || b.filter(Boolean).length>1) ? 'doubles':'singles',
            teamA:a, teamB:b, refType:'bracket', refId:bid, refMatchIndex:m.id
          });
        }
        return Object.assign({}, m, { teamA:a, teamB:b, queued:true });
      }
      return m;
    });
    newBrackets[bid] = Object.assign({}, br, { matches:matches });
  });
  if(!changed) return data;
  return Object.assign({}, data, { brackets:newBrackets, queue:queue });
}

/* ══ ③空きコートへキュー先頭を割当（従来ロジック） ══ */
function assignIdleCourts(data){
  var courtCount=data.courtCount||0;
  var queue=toArray(data.queue).slice();
  var courts=Object.assign({},data.courts||{});
  var changed=false;
  for(var i=1;i<=courtCount;i++){
    var key=String(i);
    var court=courts[key]||{status:'idle',match:null,live:null,lastResult:null};
    if(court.status==='idle'&&queue.length>0){
      var next=queue.shift();
      courts[key]=Object.assign({},court,{status:'assigned',match:next,live:null,assignedAt:Date.now()});
      changed=true;
    }
  }
  if(!changed)return data;
  return Object.assign({},data,{queue:queue,courts:courts});
}

/* ══ 自動配信ロジック本体（3段パイプライン。テスト容易にするため純関数化） ══
   data: {courtCount, queue, courts, leagues, brackets}
   戻り値: 変更後の data（変更が無ければ同一参照を返す） */
function computeDispatch(data){
  if(!data)return data;
  var d1 = applyPendingResults(data);
  var d2 = resolveBracketsIntoQueue(d1);
  var d3 = assignIdleCourts(d2);
  return d3;
}

/* ══ 管理者クライアントでのディスパッチ監視 ══
   同時に複数の管理端末が開いていても安全なようtransactionで適用 */
function watchAndDispatch(eventId){
  var ref=dbRef(eventId);
  ref.on('value',function(snap){
    var data=snap.val();
    if(!data)return;
    var next=computeDispatch(data);
    if(next!==data){
      ref.transaction(function(cur){
        if(!cur)return cur;
        return computeDispatch(cur);
      });
    }
  });
}


/* ══ localStorage: 作成した大会の一覧（管理者が後で戻れるように） ══ */
/* ══ 進行状況のエクスポート／インポート ══
   リーグ・ブラケット・キュー・コート状況をすべて含む1枚のCSVとして書き出し／読み込みする */
var EXPORT_HEADER = ['section','groupName','matchIndex','round','matchCode','time','type',
  'teamA1','teamA2','teamB1','teamB2','slotAType','slotAValue','slotBType','slotBValue',
  'status','courtNo','winner','gameWinsA','gameWinsB','pointsA','pointsB'];

function csvCell(v){
  v = (v===null||v===undefined) ? '' : String(v);
  return (v.indexOf(',')>=0 || v.indexOf('"')>=0) ? '"'+v.replace(/"/g,'""')+'"' : v;
}
function slotToTypeValue(data, ref){
  if(!ref) return ['',''];
  if(ref.type==='fixed') return ['fixed', (ref.names||[]).join('・')];
  if(ref.type==='leagueRank'){
    var lg = (data.leagues||{})[ref.leagueId];
    return ['leagueRank', (lg?lg.name:ref.leagueId)+':'+ref.rank];
  }
  if(ref.type==='matchWinner'){
    var br = (data.brackets||{})[ref.bracketId];
    return ['matchWinner', (br?br.name:ref.bracketId)+':'+ref.matchId];
  }
  return ['',''];
}

function findCourtFor(data, refType, refId, refMatchIndex){
  var courts = data.courts || {};
  var found = null;
  Object.keys(courts).forEach(function(cno){
    var c = courts[cno];
    if(c && c.match && c.match.refType===refType && c.match.refId===refId && c.match.refMatchIndex===refMatchIndex){
      found = cno;
    }
  });
  return found;
}

function exportProgressCsv(data){
  var rows = [EXPORT_HEADER];
  var leagues = data.leagues || {};
  Object.keys(leagues).forEach(function(lid){
    var lg = leagues[lid];
    toArray(lg.matches).forEach(function(m){
      var a = lg.participants[m.i]||[], b = lg.participants[m.j]||[];
      var courtNo = m.result ? '' : findCourtFor(data, 'league', lid, m.id);
      var status = m.result ? 'done' : (courtNo ? 'court' : 'pending');
      rows.push(['league', lg.name, m.id, '', '', '', lg.type||'singles',
        a[0]||'',a[1]||'', b[0]||'',b[1]||'', '','','','',
        status, courtNo||'', m.result?m.result.winner:'', m.result?m.result.gameWinsA:'', m.result?m.result.gameWinsB:'',
        m.result?m.result.pointsA:'', m.result?m.result.pointsB:'']);
    });
  });
  var brackets = data.brackets || {};
  Object.keys(brackets).forEach(function(bid){
    var br = brackets[bid];
    toArray(br.matches).forEach(function(m){
      var sa = slotToTypeValue(data, m.slotA), sb = slotToTypeValue(data, m.slotB);
      var a = m.teamA||[], b = m.teamB||[];
      var courtNo = m.result ? '' : findCourtFor(data, 'bracket', bid, m.id);
      var status = m.result ? 'done' : (courtNo ? 'court' : 'pending');
      rows.push(['bracket', br.name, m.id, m.round||1, '', '', (a.length>1||b.length>1)?'doubles':'singles',
        a[0]||'',a[1]||'', b[0]||'',b[1]||'', sa[0],sa[1],sb[0],sb[1],
        status, courtNo||'', m.result?m.result.winner:'', m.result?m.result.gameWinsA:'', m.result?m.result.gameWinsB:'',
        m.result?m.result.pointsA:'', m.result?m.result.pointsB:'']);
    });
  });
  // 「リーグ／ブラケットに属さない試合」で、既にコートに割り当て済みのものは
  // 上のループで courtNo が付いて出力済みなので、courts側では二重に出力しない。
  var courts = data.courts || {};
  var alreadyExported = {};
  Object.keys(courts).forEach(function(cno){
    var c = courts[cno];
    if(c && c.match && (c.match.refType==='league' || c.match.refType==='bracket')){
      alreadyExported[cno] = true;
    }
  });
  toArray(data.queue).forEach(function(m){
    if(m.refType==='league' || m.refType==='bracket') return; // リーグ／ブラケット側の行で出力済み扱いにするため重複させない
    rows.push(['queue','', '', '', m.matchCode||'', m.time||'', m.matchType||'singles',
      (m.teamA||[])[0]||'', (m.teamA||[])[1]||'', (m.teamB||[])[0]||'', (m.teamB||[])[1]||'',
      '','','','', 'pending', '', '','','','','']);
  });
  Object.keys(courts).forEach(function(cno){
    var c = courts[cno];
    if(c && c.match && !alreadyExported[cno]){
      rows.push(['queue','', '', '', c.match.matchCode||'', c.match.time||'', c.match.matchType||'singles',
        (c.match.teamA||[])[0]||'', (c.match.teamA||[])[1]||'', (c.match.teamB||[])[0]||'', (c.match.teamB||[])[1]||'',
        '','','','', 'court', cno, '','','','','']);
    }
  });
  return rows.map(function(r){ return r.map(csvCell).join(','); }).join('\n');
}


function parseProgressCsv(text){
  var lines = text.split(/\r?\n/).map(function(l){return l;}).filter(function(l){return l.trim()!=='';});
  var rows = lines.slice(1).map(function(line){
    // 簡易CSVパース（ダブルクォート対応）
    var cells=[]; var cur=''; var inQ=false;
    for(var i=0;i<line.length;i++){
      var ch=line[i];
      if(inQ){
        if(ch==='"'){ if(line[i+1]==='"'){cur+='"'; i++;} else inQ=false; }
        else cur+=ch;
      }else{
        if(ch==='"') inQ=true;
        else if(ch===','){ cells.push(cur); cur=''; }
        else cur+=ch;
      }
    }
    cells.push(cur);
    var o = {};
    EXPORT_HEADER.forEach(function(h,idx){ o[h]=cells[idx]!==undefined?cells[idx]:''; });
    return o;
  });

  var leagues = {};
  var brackets = {};
  var queue = [];
  var courts = {};

  var leagueRows = rows.filter(function(r){return r.section==='league';});
  var leagueGroups = {};
  leagueRows.forEach(function(r){ leagueGroups[r.groupName]=leagueGroups[r.groupName]||[]; leagueGroups[r.groupName].push(r); });
  var leagueNameToId = {};
  Object.keys(leagueGroups).forEach(function(name){
    var lid = uid();
    leagueNameToId[name] = lid;
    var grows = leagueGroups[name].sort(function(a,b){return Number(a.matchIndex)-Number(b.matchIndex);});
    var participants = []; var pairIndex = {};
    function idxOf(a1,a2){
      var key = a1+'|'+a2;
      if(pairIndex[key]===undefined){ pairIndex[key]=participants.length; participants.push([a1,a2].filter(Boolean)); }
      return pairIndex[key];
    }
    var matches = grows.map(function(r){
      var i = idxOf(r.teamA1, r.teamA2);
      var j = idxOf(r.teamB1, r.teamB2);
      var result = r.status==='done' ? { winner:r.winner, gameWinsA:Number(r.gameWinsA)||0, gameWinsB:Number(r.gameWinsB)||0, pointsA:Number(r.pointsA)||0, pointsB:Number(r.pointsB)||0 } : null;
      return { id:Number(r.matchIndex)||0, i:i, j:j, result:result, _status:r.status, _courtNo:r.courtNo };
    });
    leagues[lid] = { id:lid, name:name, type: (grows[0]&&grows[0].type)||'singles', participants:participants,
      matches: matches.map(function(m){ return { id:m.id, i:m.i, j:m.j, result:m.result }; }) };
    // 未実施でコート未割当の試合はキューへ、コート割当中の試合は該当コートへ復元
    matches.forEach(function(m){
      if(m.result) return;
      var item = {
        id: uid(), time:'', matchCode: name+'-'+(m.id+1), matchType: leagues[lid].type,
        teamA: leagues[lid].participants[m.i], teamB: leagues[lid].participants[m.j],
        refType:'league', refId:lid, refMatchIndex:m.id
      };
      if(m._status==='court' && m._courtNo){
        courts[m._courtNo] = { status:'assigned', match:item, live:null, lastResult:null, assignedAt:Date.now() };
      }else{
        queue.push(item);
      }
    });
  });

  var bracketRows = rows.filter(function(r){return r.section==='bracket';});
  var bracketGroups = {};
  bracketRows.forEach(function(r){ bracketGroups[r.groupName]=bracketGroups[r.groupName]||[]; bracketGroups[r.groupName].push(r); });
  var bracketNameToId = {};
  Object.keys(bracketGroups).forEach(function(name){ bracketNameToId[name]=uid(); });
  function parseSlot(type, value){
    if(!type) return null;
    if(type==='fixed') return { type:'fixed', names: value.split('・').map(function(s){return s.trim();}).filter(Boolean) };
    if(type==='leagueRank'){
      var parts = value.split(':'); 
      var lid = leagueNameToId[parts[0]] || parts[0];
      return { type:'leagueRank', leagueId: lid, rank: Number(parts[1])||1 };
    }
    if(type==='matchWinner'){
      var p2 = value.split(':');
      var bid = bracketNameToId[p2[0]] || p2[0];
      return { type:'matchWinner', bracketId: bid, matchId: Number(p2[1])||0 };
    }
    return null;
  }
  Object.keys(bracketGroups).forEach(function(name){
    var bid = bracketNameToId[name];
    var grows = bracketGroups[name].sort(function(a,b){return Number(a.matchIndex)-Number(b.matchIndex);});
    var matches = grows.map(function(r){
      var teamA = (r.teamA1||r.teamA2) ? [r.teamA1,r.teamA2].filter(Boolean) : null;
      var teamB = (r.teamB1||r.teamB2) ? [r.teamB1,r.teamB2].filter(Boolean) : null;
      var result = r.status==='done' ? { winner:r.winner, gameWinsA:Number(r.gameWinsA)||0, gameWinsB:Number(r.gameWinsB)||0, pointsA:Number(r.pointsA)||0, pointsB:Number(r.pointsB)||0 } : null;
      var queuedAlready = !!(teamA && teamB && (r.status==='court' || r.status==='pending'));
      return {
        id:Number(r.matchIndex)||0, round:Number(r.round)||1,
        slotA: parseSlot(r.slotAType, r.slotAValue), slotB: parseSlot(r.slotBType, r.slotBValue),
        teamA: teamA, teamB: teamB, queued: queuedAlready, result: result,
        _status:r.status, _courtNo:r.courtNo
      };
    });
    brackets[bid] = { id:bid, name:name, matches: matches.map(function(m){
      return { id:m.id, round:m.round, slotA:m.slotA, slotB:m.slotB, teamA:m.teamA, teamB:m.teamB, queued:m.queued, result:m.result };
    }) };
    // 両者確定済みだが未実施の試合は、キューまたはコートへ復元する
    matches.forEach(function(m){
      if(m.result || !m.teamA || !m.teamB) return;
      var item = {
        id: uid(), time:'', matchCode: name+'-'+m.id, matchType: (m.teamA.length>1||m.teamB.length>1)?'doubles':'singles',
        teamA:m.teamA, teamB:m.teamB, refType:'bracket', refId:bid, refMatchIndex:m.id
      };
      if(m._status==='court' && m._courtNo){
        courts[m._courtNo] = { status:'assigned', match:item, live:null, lastResult:null, assignedAt:Date.now() };
      }else{
        queue.push(item);
      }
    });
  });

  rows.filter(function(r){return r.section==='queue';}).forEach(function(r){
    var item = {
      id: uid(), time:r.time, matchCode:r.matchCode, matchType:r.type||'singles',
      teamA:[r.teamA1,r.teamA2].filter(Boolean), teamB:[r.teamB1,r.teamB2].filter(Boolean)
    };
    if(r.status==='court' && r.courtNo){
      courts[r.courtNo] = { status:'assigned', match:item, live:null, lastResult:null, assignedAt:Date.now() };
    }else{
      queue.push(item);
    }
  });

  return { leagues:leagues, brackets:brackets, queue:queue, courts:courts };
}

function downloadTextFile(filename, text){
  var blob = new Blob(["\uFEFF"+text], {type:'text/csv;charset=utf-8;'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href=url; a.download=filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

    card.appendChild(el('div',{className:'court-idle-msg'},'次の試合待ち'));
  }else{

    tr.appendChild(el('td',{className:'name-cell'},teamLabel(league.participants[i])));
    for(var j=0;j<n;j++){
      if(i===j){ tr.appendChild(el('td',{},'')); continue; }
      var m = participantMatchResult(league, i, j);
      if(!m){ tr.appendChild(el('td',{},'')); continue; }
      if(!m.result){
        var courtNo = findCourtFor(data, 'league', league.id, m.id);
        if(courtNo){
          anyLive = true;
          tr.appendChild(el('td',{className:'mark-live'},[el('span',{className:'live-dot'}), 'C'+courtNo]));
        }else{
          tr.appendChild(el('td',{},''));
        }
        continue;
      }
      var iWon = (m.i===i && m.result.winner==='A') || (m.j===i && m.result.winner==='B');
      tr.appendChild(el('td',{className: iWon?'mark-o':'mark-x'}, iWon?'○':'×'));
    }
    var s = statByIdx[i];
    tr.appendChild(el('td',{}, s ? (s.wins+'-'+s.losses) : ''));
    tr.appendChild(el('td',{}, rankByIdx[i] || (st.needsManualTiebreak?'同率':'')));
    table.appendChild(tr);
  }
  card.appendChild(table);
  if(anyLive){
    card.appendChild(el('div',{className:'live-legend'},[el('span',{className:'live-dot'}),' 進行中（コート番号を表示）']));
  }

  if(st.needsManualTiebreak && isAdmin){
    var warn = el('div',{className:'tie-warn'},'同率のため順位を手動で確定してください（勝敗・ゲーム率・ポイント率すべて同じ相手がいます）。下の欄に順位順で番号をカンマ区切りで入力してください（例: 2,0,1）。');
    var ord = el('input',{className:'field-inp',placeholder:'例: 2,0,1',style:{marginTop:'8px'}});
    var okBtn = el('button',{className:'btn btn-outline',style:{marginTop:'8px'}},'この順位で確定');
    okBtn.onclick=function(){
      var arr = ord.value.split(',').map(function(s){return parseInt(s.trim(),10);});
      if(arr.length!==n || arr.some(function(x){return isNaN(x)||x<0||x>=n;})){ alert('人数分の番号（0〜'+(n-1)+'）をカンマ区切りで入力してください'); return; }
      dbRef(eventId).child('leagues/'+league.id+'/tieOverride').set(arr).then(refreshFn);
    };
    warn.appendChild(el('div',{},[ord, okBtn]));
    card.appendChild(warn);
  }else if(st.needsManualTiebreak){
    card.appendChild(el('div',{className:'tie-warn'},'同率のため本部による順位確定待ちです。'));
  }
  return card;
}

function bracketSlotLabel(data, ref){
  if(!ref) return '(未設定)';
  if(ref.type==='fixed') return teamLabel(ref.names);
  if(ref.type==='leagueRank'){
    var lg = (data.leagues||{})[ref.leagueId];
    return (lg?lg.name:'?')+' '+ref.rank+'位';
  }
  if(ref.type==='matchWinner'){
    var br = (data.brackets||{})[ref.bracketId];
    return (br?br.name:'?')+' 第'+(ref.matchId+1)+'試合 勝者';
  }
  return '?';
}

function buildBracketCard(data, bracket){
  var card = el('div',{className:'league-card'});
  card.appendChild(el('h3',{},bracket.name));
  var rounds = {};
  toArray(bracket.matches).forEach(function(m){
    var r = m.round||1;
    rounds[r] = rounds[r]||[];
    rounds[r].push(m);
  });
  Object.keys(rounds).sort(function(a,b){return a-b;}).forEach(function(r){
    var roundWrap = el('div',{className:'bracket-round'});
    roundWrap.appendChild(el('div',{className:'bracket-round-label'},'ROUND '+r));
    rounds[r].forEach(function(m){
      var aLabel = m.teamA ? teamLabel(m.teamA) : bracketSlotLabel(data, m.slotA);
      var bLabel = m.teamB ? teamLabel(m.teamB) : bracketSlotLabel(data, m.slotB);
      var row = el('div',{className:'bracket-match'});
      var aEl = el('span',{className: (!m.teamA?'pending':(m.result && m.result.winner==='A'?'winner':''))}, aLabel);
      var bEl = el('span',{className: (!m.teamB?'pending':(m.result && m.result.winner==='B'?'winner':''))}, bLabel);
      row.appendChild(aEl); row.appendChild(el('span',{},'vs')); row.appendChild(bEl);
      if(m.result){
        row.appendChild(el('span',{className:'score'}, m.result.gameWinsA+'-'+m.result.gameWinsB));
      }
      roundWrap.appendChild(row);
    });
    card.appendChild(roundWrap);
  });
  return card;
}

/* ══ キューに残っている試合コードから、既存の総当たりブロックを自動検出してリーグ化する ══
   例: A2-A-1, A2-A-2, ... A2-A-6 → グループ名「A2-A」として1つのリーグにまとめる */
function autoDetectLeaguesFromQueue(data){
  var groups = {};
  function collect(item, courtNo){
    if(!item || !item.matchCode) return;
    if(item.refType) return; // 既にリーグ／ブラケットに紐付いている試合は対象外
    var m = /^(.*)-(\d+)$/.exec(item.matchCode);
    if(!m) return;
    var groupName = m[1];
    var num = parseInt(m[2], 10);
    groups[groupName] = groups[groupName] || [];
    groups[groupName].push({ num: num, item: item, courtNo: courtNo || null });
  }
  toArray(data.queue).forEach(function(it){ collect(it, null); });
  Object.keys(data.courts||{}).forEach(function(cno){
    var c = data.courts[cno];
    if(c && c.match) collect(c.match, cno);
  });
  var candidateGroups = Object.keys(groups).filter(function(g){ return groups[g].length >= 2; }).sort();
  return { groups: groups, candidateGroups: candidateGroups };
}

function buildLeaguesFromGroups(data, groupNames){
  var detection = autoDetectLeaguesFromQueue(data);
  var leagues = Object.assign({}, data.leagues||{});
  var queue = toArray(data.queue).slice();
  var courts = Object.assign({}, data.courts||{});

  groupNames.forEach(function(groupName){
    var entries = detection.groups[groupName];
    if(!entries) return;
    entries = entries.slice().sort(function(a,b){ return a.num - b.num; });

    var participants = []; var pairIndex = {};
    function idxOf(team){
      var key = JSON.stringify(team||[]);
      if(pairIndex[key]===undefined){ pairIndex[key]=participants.length; participants.push(team||[]); }
      return pairIndex[key];
    }
    var lid = uid();
    var matches = entries.map(function(e){
      return { id: e.num-1, i: idxOf(e.item.teamA), j: idxOf(e.item.teamB), result: null };
    });
    var type = (entries[0].item.matchType) || 'singles';
    leagues[lid] = { id:lid, name:groupName, type:type, participants:participants, matches:matches };

    entries.forEach(function(e){
      var refInfo = { refType:'league', refId:lid, refMatchIndex: e.num-1 };
      if(e.courtNo){
        courts[e.courtNo] = Object.assign({}, courts[e.courtNo], {
          match: Object.assign({}, courts[e.courtNo].match, refInfo)
        });
      }else{
        var qi = queue.indexOf(e.item);
        if(qi>=0) queue[qi] = Object.assign({}, queue[qi], refInfo);
      }
    });
  });

  return { leagues:leagues, queue:queue, courts:courts };
}

function buildTournamentView(eventId, data, isAdmin){
  var wrap = el('div');
  var leagues = data.leagues || {};
  var brackets = data.brackets || {};
  function refresh(){ /* Firebaseの.on('value')経由で自動的に再描画されるため何もしなくてよい */ }

  wrap.appendChild(el('div',{className:'section-label'},'リーグ表'));
  if(isAdmin){
    var detection = autoDetectLeaguesFromQueue(data);
    if(detection.candidateGroups.length > 0){
      var autoBox = el('div',{className:'create-form'});
      autoBox.appendChild(el('div',{className:'section-title'},'キューの試合コードから自動検出'));
      autoBox.appendChild(el('div',{style:{fontSize:12,color:'var(--ink3)',marginBottom:8}},
        '試合コードの末尾番号（例: A2-A-1〜A2-A-6）から、同じブロックの試合をまとめてリーグ化できます。'));
      var checks = [];
      detection.candidateGroups.forEach(function(g){
        var row = el('label',{style:{display:'flex',alignItems:'center',gap:'8px',fontSize:13,marginBottom:'6px'}});
        var cb = document.createElement('input'); cb.type='checkbox'; cb.checked=true; cb.value=g;
        checks.push(cb);
        row.appendChild(cb);
        row.appendChild(document.createTextNode(g+'（'+detection.groups[g].length+'試合）'));
        autoBox.appendChild(row);
      });
      var detectMsg = el('div',{className:'ok-msg'});
      var detectBtn = el('button',{className:'btn btn-primary',style:{marginTop:8}},'選択したグループをリーグとして登録');
      detectBtn.onclick=function(){
        var selected = checks.filter(function(c){return c.checked;}).map(function(c){return c.value;});
        if(selected.length===0){ return; }
        var result = buildLeaguesFromGroups(data, selected);
        dbRef(eventId).update({ leagues: result.leagues, queue: result.queue, courts: result.courts })
          .then(function(){ detectMsg.textContent = selected.length+'件のリーグを登録しました。'; })
          .catch(function(e){ detectMsg.className='err'; detectMsg.textContent='失敗: '+e.message; });
      };
      autoBox.appendChild(detectBtn); autoBox.appendChild(detectMsg);
      wrap.appendChild(autoBox);
    }
  }
  if(Object.keys(leagues).length===0){
    wrap.appendChild(el('div',{style:{padding:'10px 18px',color:'var(--ink3)',fontSize:13}},'まだリーグがありません。'));
  }
  Object.keys(leagues).forEach(function(lid){
    wrap.appendChild(buildLeagueCard(eventId, data, leagues[lid], isAdmin, refresh));
  });

  wrap.appendChild(el('div',{className:'section-label'},'決勝トーナメント'));
  if(Object.keys(brackets).length===0){
    wrap.appendChild(el('div',{style:{padding:'10px 18px',color:'var(--ink3)',fontSize:13}},'まだブラケットがありません。'));
  }
  Object.keys(brackets).forEach(function(bid){
    wrap.appendChild(buildBracketCard(data, brackets[bid]));
  });

  return wrap;
}

/* ══ 設定画面：共有・バドる連携リンク・エクスポート／インポート ══ */
var DEFAULT_BADORU_URL = 'https://sasaki0369.github.io/badru/';

function settingsRow(label, sub, actionEl){
  var left = el('div',{},[
    el('div',{className:'settings-row-label'},label),
    sub ? el('div',{className:'settings-row-sub'},sub) : null
  ]);
  return el('div',{className:'settings-row'},[left, el('div',{className:'settings-row-action'},actionEl)]);
}

function buildSettingsView(eventId, data){
  var wrap = el('div',{style:{paddingBottom:'24px'}});

  // --- 試合ルール（バドる連携時に自動反映） ---
  var rulesSection = el('div',{className:'settings-section'});
  rulesSection.appendChild(el('div',{className:'settings-section-title'},'試合ルール'));
  var rules = Object.assign({ format:'best3', points:15, deuce:true, deuceMax:21 }, data.matchRules||{});

  function saveRules(patch){
    var next = Object.assign({}, rules, patch);
    dbRef(eventId).child('matchRules').set(next);
  }

  var rulesCard = el('div',{className:'settings-list',style:{padding:'14px 16px'}});

  function segRow(label, options, current, onPick){
    var row = el('div',{style:{marginBottom:'12px'}});
    row.appendChild(el('div',{className:'settings-row-sub',style:{marginBottom:'6px'}},label));
    var seg = el('div',{style:{display:'flex',gap:'6px',flexWrap:'wrap'}});
    options.forEach(function(opt){
      var btn = el('button',{className:'pill-btn'+(current===opt.value?' pill-dark':'')},opt.label);
      btn.onclick=function(){ onPick(opt.value); };
      seg.appendChild(btn);
    });
    row.appendChild(seg);
    return row;
  }

  rulesCard.appendChild(segRow('試合形式',
    [{value:'best3',label:'3ゲームマッチ'},{value:'single',label:'1ゲームマッチ'}],
    rules.format, function(v){ saveRules({format:v}); }));

  rulesCard.appendChild(segRow('得点',
    [{value:15,label:'15点'},{value:21,label:'21点'}],
    rules.points, function(v){ saveRules({points:v, deuceMax: v===15?21:30}); }));

  rulesCard.appendChild(segRow('セッティング（デュース）',
    [{value:true,label:'あり'},{value:false,label:'なし'}],
    rules.deuce, function(v){ saveRules({deuce:v}); }));

  if(rules.deuce){
    var deuceMaxRow = el('div',{});
    deuceMaxRow.appendChild(el('div',{className:'settings-row-sub',style:{marginBottom:'6px'}},'セッティング時の最大点'));
    var deuceMaxInp = el('input',{className:'settings-inp',type:'number',value:String(rules.deuceMax),style:{maxWidth:'120px'}});
    deuceMaxInp.onchange=function(){ saveRules({deuceMax: parseInt(deuceMaxInp.value,10)||rules.points+6}); };
    deuceMaxRow.appendChild(deuceMaxInp);
    rulesCard.appendChild(deuceMaxRow);
  }

  rulesSection.appendChild(rulesCard);
  rulesSection.appendChild(el('div',{className:'settings-row-sub',style:{margin:'8px 4px 0'}},
    '連携中のバドるには、試合開始時にこのルールが自動的に反映されます（選手名・種目は各試合のデータがそのまま使われます）。'));
  wrap.appendChild(rulesSection);

  // --- 共有 ---
  var shareSection = el('div',{className:'settings-section'});
  shareSection.appendChild(el('div',{className:'settings-section-title'},'共有'));
  var shareList = el('div',{className:'settings-list'});
  var shareBtn = el('button',{className:'pill-btn pill-dark'},'コピー');
  shareBtn.onclick=function(){
    var url=getBase()+'#view:'+eventId;
    try{navigator.clipboard.writeText(url);}catch(e){}
    shareBtn.textContent='✓ コピー済み';
    setTimeout(function(){shareBtn.textContent='コピー';},1600);
  };
  shareList.appendChild(settingsRow('参加者向け共有リンク','進行状況を閲覧のみできるリンクです', shareBtn));
  shareSection.appendChild(shareList);
  wrap.appendChild(shareSection);

  // --- バドる連携 ---
  var badoruSection = el('div',{className:'settings-section'});
  badoruSection.appendChild(el('div',{className:'settings-section-title'},'バドる連携'));
  var badoruList = el('div',{className:'settings-list'});

  var urlInp = el('input',{className:'settings-inp',value:data.badoruBaseUrl||DEFAULT_BADORU_URL});
  urlInp.onchange=function(){
    dbRef(eventId).child('badoruBaseUrl').set(urlInp.value.trim()||DEFAULT_BADORU_URL);
  };
  badoruList.appendChild(settingsRow('バドるのURL','各コートの連携リンクの生成元です', urlInp));
  badoruSection.appendChild(badoruList);

  var courtCount = data.courtCount||0;
  var linksList = el('div',{className:'settings-list',style:{marginTop:'8px'}});
  var baseUrl = (data.badoruBaseUrl||DEFAULT_BADORU_URL).replace(/\/?$/, '/');
  for(var i=1;i<=courtCount;i++){
    (function(courtNo){
      var link = baseUrl + '?taikaEvent=' + encodeURIComponent(eventId) + '&court=' + courtNo;
      var copyBtn = el('button',{className:'pill-btn'},'コピー');
      copyBtn.onclick=function(){
        try{navigator.clipboard.writeText(link);}catch(e){}
        copyBtn.textContent='✓';
        setTimeout(function(){copyBtn.textContent='コピー';},1400);
      };
      linksList.appendChild(el('div',{className:'court-link-row'},[
        el('span',{className:'court-link-no'},'コート '+courtNo),
        copyBtn
      ]));
    })(i);
  }
  if(courtCount===0){
    linksList.appendChild(el('div',{style:{padding:'14px 16px',color:'var(--ink3)',fontSize:13}},'コート数が設定されていません。'));
  }
  badoruSection.appendChild(el('div',{className:'settings-row-sub',style:{margin:'10px 4px 4px'}},'各コートのタブレットでリンクを1回開くと、そのコート専用として自動的に連携されます。'));
  badoruSection.appendChild(linksList);
  wrap.appendChild(badoruSection);

  // --- 進行状況 ---
  var dataSection = el('div',{className:'settings-section'});
  dataSection.appendChild(el('div',{className:'settings-section-title'},'進行状況'));
  var dataList = el('div',{className:'settings-list'});

  var exportBtn = el('button',{className:'pill-btn'},'エクスポート');
  exportBtn.onclick=function(){
    var csv = exportProgressCsv(data);
    downloadTextFile((data.eventName||'大会')+'_進行状況.csv', csv);
  };
  dataList.appendChild(settingsRow('進行状況をエクスポート','リーグ・ブラケット・キュー・コートをCSVに書き出します', exportBtn));

  var importInp = el('input',{type:'file',accept:'.csv',style:{display:'none'}});
  var importBtn = el('button',{className:'pill-btn pill-danger'},'インポート');
  importBtn.onclick=function(){ importInp.click(); };
  importInp.onchange=function(){
    var f = importInp.files[0];
    if(!f) return;
    var reader = new FileReader();
    reader.onload=function(e){
      var text;
      try{ text = new TextDecoder('utf-8',{fatal:true}).decode(e.target.result); }
      catch(err){ text = new TextDecoder('utf-8',{fatal:false}).decode(e.target.result); }
      var imported = parseProgressCsv(text);
      if(!confirm('現在の大会の「リーグ・ブラケット・キュー・コート」をインポート内容で置き換えます。よろしいですか？')) return;
      dbRef(eventId).update({ leagues:imported.leagues, brackets:imported.brackets, queue:imported.queue, courts:imported.courts })
        .then(function(){ alert('インポートしました。'); })
        .catch(function(e){ alert('失敗しました: '+e.message); });
    };
    reader.readAsArrayBuffer(f);
  };
  dataList.appendChild(settingsRow('進行状況をインポート','CSVから大会の状態を復元します（現在の内容を置き換えます）', importBtn));
  dataList.appendChild(importInp);

  var addCsvInp = el('input',{type:'file',accept:'.csv',style:{display:'none'}});
  var addCsvBtn = el('button',{className:'pill-btn'},'追加');
  addCsvBtn.onclick=function(){ addCsvInp.click(); };
  addCsvInp.onchange=function(){
    var f = addCsvInp.files[0];
    if(!f) return;
    readCsvFile(f, function(text){
      var parsed = csvParseMatchesAndBrackets(text);
      var newQueue = toArray(data.queue).concat(parsed.queue);
      var newBrackets = Object.assign({}, data.brackets||{}, parsed.brackets);
      dbRef(eventId).update({ queue:newQueue, brackets:newBrackets })
        .then(function(){ alert(parsed.queue.length+'件の試合、'+Object.keys(parsed.brackets).length+'件の決勝トーナメントを追加しました。'); })
        .catch(function(e){ alert('失敗しました: '+e.message); });
    });
  };
  dataList.appendChild(settingsRow('試合キューCSVを追加で取り込む','現在の内容に追加します（決勝トーナメントの後から追加にも使えます）', addCsvBtn));
  dataList.appendChild(addCsvInp);

  dataSection.appendChild(dataList);
  wrap.appendChild(dataSection);

  return wrap;
}

function mountProgress(eventId,data,role){
  var isAdmin=role==='admin';
  var root=el('div',{style:{minHeight:'100vh'}});
  var appbar=el('div',{className:'appbar'},[
    el('span',{className:'appbar-title'},(data.eventName||'大会Now')),
    isAdmin?null:el('span',{className:'viewer-chip'},'閲覧')
  ]);
  root.appendChild(appbar);

  var tabs = el('div',{className:'tabs'});
  var tabCourts = el('button',{className:'tab-btn'+(activeTab==='courts'?' active':'')},'コート状況');
  var tabTournament = el('button',{className:'tab-btn'+(activeTab==='tournament'?' active':'')},'リーグ・トーナメント');
  tabCourts.onclick=function(){ activeTab='courts'; mountProgress(eventId,data,role); };
  tabTournament.onclick=function(){ activeTab='tournament'; mountProgress(eventId,data,role); };
  tabs.appendChild(tabCourts); tabs.appendChild(tabTournament);
  if(isAdmin){
    var tabSettings = el('button',{className:'tab-btn'+(activeTab==='settings'?' active':'')},'設定');
    tabSettings.onclick=function(){ activeTab='settings'; mountProgress(eventId,data,role); };
    tabs.appendChild(tabSettings);
  }
  root.appendChild(tabs);

  if(activeTab==='settings' && isAdmin){
    root.appendChild(buildSettingsView(eventId, data));
    render(root);
    return;
  }

  if(activeTab==='tournament'){
    root.appendChild(buildTournamentView(eventId, data, isAdmin));
    render(root);
    return;
  }

  root.appendChild(el('div',{className:'section-label'},'コート状況'));
  var grid=el('div',{className:'court-grid'});
  var courtCount=data.courtCount||0;
  for(var i=1;i<=courtCount;i++){
    grid.appendChild(buildCourtCard(i,(data.courts||{})[String(i)]));
  }
  root.appendChild(grid);

  var queue=toArray(data.queue);
  root.appendChild(el('div',{className:'section-label'},'キュー待ち（残り'+queue.length+'件）'));
  var queueWrap=el('div');
  queue.slice(0,10).forEach(function(m,idx){
    queueWrap.appendChild(el('div',{className:'queue-row'},[
      el('span',{className:'queue-idx'},String(idx+1)),
      el('span',{className:'queue-teams'},teamLabel(m.teamA)+' vs '+teamLabel(m.teamB)),
      el('span',{className:'queue-time'},m.time||'')
    ]));
  });
  if(queue.length===0){
    queueWrap.appendChild(el('div',{style:{padding:'12px 18px',color:'var(--ink3)',fontSize:13}},'キューは空です'));
  }
  root.appendChild(queueWrap);

  render(root);
}

/* ══ 起動 ══ */
function startAdmin(eventId){
  watchAndDispatch(eventId);
  dbListen(eventId,function(data){
    if(!data){
      render(el('div',{style:{padding:20}},'大会データが見つかりません'));
      return;
    }
    mountProgress(eventId,data,'admin');
  });
}
function startView(eventId){
  dbListen(eventId,function(data){
    if(!data){
      render(el('div',{style:{padding:20}},'大会データが見つかりません'));
      return;
    }
    mountProgress(eventId,data,'view');
  });
}

function boot(){
  var h=parseHash();
  if(h.mode==='admin'&&h.eventId){startAdmin(h.eventId);return;}
  if(h.mode==='view'&&h.eventId){startView(h.eventId);return;}
  mountSetup();
}
window.addEventListener('hashchange',function(){dbOff();boot();});
boot();
