function buildTournamentView(eventId, data, isAdmin){
  var wrap = el('div');
  var leagues = data.leagues || {};
  var brackets = data.brackets || {};
  function refresh(){ /* Firebaseの.on('value')経由で自動的に再描画されるため何もしなくてよい */ }

  if(allTournamentMatchesFinished(data)){
    wrap.appendChild(buildFinalResultsSummary(data));
  }

  wrap.appendChild(el('div',{className:'section-label'},'リーグ結果'));
  if(isAdmin){
    var detection = autoDetectLeaguesFromQueue(data);
    if(detection.candidateGroups.length > 0){
      var autoBox = el('div',{className:'create-form'});
      autoBox.appendChild(el('div',{className:'section-title'},'リーグを作成'));
      autoBox.appendChild(el('div',{style:{fontSize:12,color:'var(--ink3)',marginBottom:8}},
        'CSVからリーグ戦と思われるグループを検出しました。内容を確認し、作成するリーグを選択してください。'));
      var checks = [];
      detection.candidateGroups.forEach(function(g){
        var row = el('label',{style:{display:'flex',alignItems:'center',gap:'8px',fontSize:13,marginBottom:'6px'}});
        var cb = document.createElement('input'); cb.type='checkbox'; cb.checked=true; cb.value=g;
        checks.push(cb);
        row.appendChild(cb);
        row.appendChild(document.createTextNode(g+'（'+detection.groups[g].length+'試合）'));
        autoBox.appendChild(row);
      });
      var detectMsg = el('div',{className:'ok-msg'});
      var detectBtn = el('button',{className:'btn btn-primary',style:{marginTop:8}},'選択したグループをリーグとして登録');
      detectBtn.onclick=function(){
        var selected = checks.filter(function(c){return c.checked;}).map(function(c){return c.value;});
        if(selected.length===0){ return; }
        var result = buildLeaguesFromGroups(data, selected);
        dbRef(eventId).update({ leagues: result.leagues, queue: result.queue, courts: result.courts })
          .then(function(){
            detectMsg.textContent = selected.length+'件のリーグを登録しました。設定画面へ移動します。';
            activeTab = 'settings';
          })
          .catch(function(e){ detectMsg.className='err'; detectMsg.textContent='失敗: '+e.message; });
      };
      autoBox.appendChild(detectBtn); autoBox.appendChild(detectMsg);
      wrap.appendChild(autoBox);
    }
  }
  var leagueIds = orderedLeagueIds(data);
  if(leagueIds.length===0){
    wrap.appendChild(el('div',{style:{padding:'10px 18px',color:'var(--ink3)',fontSize:13}},'まだリーグがありません。'));
  }else if(isAdmin){
    wrap.appendChild(el('div',{style:{padding:'0 18px 6px',fontSize:11,color:'var(--ink3)'}},'⠿ を掴んでドラッグすると表示順を変更できます。'));
  }
  var leagueList = el('div',{className:'league-list'});
  leagueIds.forEach(function(lid){
    var card = buildLeagueCard(eventId, data, leagues[lid], isAdmin, refresh);
    card.setAttribute('data-league-id', lid);
    if(isAdmin){
      var handle = el('span',{className:'drag-handle'},'⠿');
      var h3 = card.querySelector('h3');
      h3.insertBefore(handle, h3.firstChild);
    }
    leagueList.appendChild(card);
  });
  wrap.appendChild(leagueList);
  if(isAdmin && leagueIds.length>1){
    makeReorderable(leagueList, '.league-card', function(cardEl){ return cardEl.getAttribute('data-league-id'); }, function(order){
      dbRef(eventId).child('leagueOrder').set(order);
    });
  }

  wrap.appendChild(el('div',{className:'section-label'},allTournamentMatchesFinished(data)?'トーナメント結果':'決勝トーナメント'));
  if(Object.keys(brackets).length===0){
    wrap.appendChild(el('div',{style:{padding:'10px 18px',color:'var(--ink3)',fontSize:13}},'まだブラケットがありません。'));
  }
  // CSV上で試合ごとに別ブラケットとして登録されていても、試合コードの種目単位で統合して
  // 1回戦から決勝までを一つの勝ち上がり表として表示する。
  buildTournamentDisplayGroups(brackets).forEach(function(br){
    wrap.appendChild(buildBracketCard(data, br));
  });

  return wrap;
}

function collectAllPlayerNames(data){
  var names = {};
  Object.keys(data.leagues||{}).forEach(function(lid){
    toArray(data.leagues[lid].participants).forEach(function(team){
      toArray(team).forEach(function(n){ if(n) names[n]=true; });
    });
  });
  toArray(data.queue).forEach(function(item){
    toArray(item.teamA).concat(toArray(item.teamB)).forEach(function(n){ if(n) names[n]=true; });
  });
  Object.keys(data.brackets||{}).forEach(function(bid){
    toArray(data.brackets[bid].matches).forEach(function(m){
      toArray(m.teamA).concat(toArray(m.teamB)).forEach(function(n){ if(n) names[n]=true; });
    });
  });
  Object.keys(data.courts||{}).forEach(function(cno){
    var c = data.courts[cno];
    if(c && c.match){ toArray(c.match.teamA).concat(toArray(c.match.teamB)).forEach(function(n){ if(n) names[n]=true; }); }
  });
  return Object.keys(names).sort(function(a,b){ return a.localeCompare(b,'ja'); });
}

function buildWithdrawalManager(eventId, data){
  var section = el('div',{className:'settings-section'});
  section.appendChild(el('div',{className:'settings-section-title'},'棄権（不戦敗）'));
  var list = el('div',{className:'settings-list',style:{padding:'12px 16px'}});

  var withdrawn = data.withdrawnPlayers || {};
  var withdrawnNames = Object.keys(withdrawn);

  if(withdrawnNames.length > 0){
    list.appendChild(el('div',{className:'settings-row-sub',style:{marginBottom:'8px'}},'棄権登録中の選手（以後の未実施の試合はすべて相手の不戦勝になります）：'));
    withdrawnNames.forEach(function(name){
      var undoBtn = el('button',{className:'pill-btn'},'取り消す');
      undoBtn.onclick=function(){
        var next = Object.assign({}, withdrawn);
        delete next[name];
        dbRef(eventId).child('withdrawnPlayers').set(next);
      };
      list.appendChild(el('div',{className:'search-hit'},[
        el('span',{className:'search-badge done'},'棄権'),
        el('span',{style:{flex:1}}, name),
        undoBtn
      ]));
    });
  }else{
    list.appendChild(el('div',{style:{fontSize:12.5,color:'var(--ink3)',marginBottom:'8px'}},'現在、棄権登録されている選手はいません。'));
  }

  var inp = el('input',{className:'settings-inp',placeholder:'棄権する選手名を入力',style:{marginTop:'6px'}});
  var suggestWrap = el('div',{style:{display:'flex',flexWrap:'wrap',gap:'6px',marginTop:'8px'}});
  var allNames = collectAllPlayerNames(data);
  inp.oninput=function(){
    var q = inp.value.trim();
    suggestWrap.innerHTML = '';
    if(!q) return;
    allNames.filter(function(n){ return n.indexOf(q)>=0 && !withdrawn[n]; }).slice(0,8).forEach(function(n){
      var btn = el('button',{className:'pill-btn'},n);
      btn.onclick=function(){ registerWithdrawal(n); };
      suggestWrap.appendChild(btn);
    });
  };
  function registerWithdrawal(name){
    if(!name) return;
    var next = Object.assign({}, withdrawn);
    next[name] = true;
    dbRef(eventId).child('withdrawnPlayers').set(next).then(function(){ inp.value=''; suggestWrap.innerHTML=''; });
  }
  var addBtn = el('button',{className:'pill-btn pill-danger',style:{marginTop:'8px'}},'この名前で棄権登録');
  addBtn.onclick=function(){ registerWithdrawal(inp.value.trim()); };

  list.appendChild(inp);
  list.appendChild(suggestWrap);
  list.appendChild(addBtn);
  section.appendChild(list);
  section.appendChild(el('div',{className:'settings-row-sub',style:{margin:'8px 4px 0'}},
    'ダブルスの場合は、ペアの片方の名前だけで登録すればチーム全体が対象になります。不戦敗の順位計算方法は下のA～Cから大会ごとに選択できます（初期値A）。Aは補完スコア、Bは勝敗のみ、Cは大会離脱者のリーグ戦を順位計算から除外します。'));
  return section;
}

/* ══ CSV基準＋実績ベースの所要時間・予測時刻 ══ */
function avgMatchDurationMs(data){
  var arr = toArray(data.matchDurations).slice(-20);
  // 正常終了した実績が20試合そろうまではCSVの時間差を使う。
  if(arr.length < 20) return null;
  var sum = arr.reduce(function(s,v){return s+v;}, 0);
  return sum / arr.length;
}

function fmtHHMM(ts){
  var d = new Date(ts);
  var h = String(d.getHours()).padStart(2,'0');
  var m = String(d.getMinutes()).padStart(2,'0');
  return h+':'+m;
}

/* HH:MM を「今日のその時刻」のtimestampに変換する。深夜またぎにも最低限対応。 */
function scheduledTsToday(time, aroundTs){
  var mins = timeToMinutes(time);
  if(mins===null) return null;
  var base = new Date(aroundTs || Date.now());
  var d = new Date(base.getFullYear(), base.getMonth(), base.getDate(), Math.floor(mins/60), mins%60, 0, 0);
  // aroundTsから12時間以上離れる場合は日付またぎとみなす
  if(aroundTs){
    if(d.getTime() - aroundTs > 12*60*60*1000) d.setDate(d.getDate()-1);
    else if(aroundTs - d.getTime() > 12*60*60*1000) d.setDate(d.getDate()+1);
  }
  return d.getTime();
}

/* 実績20試合未満：CSVに記載された時刻差をそのまま維持する。
   大会がCSV予定より早い/遅い場合にも追随できるよう、現在コートへ配信済みの試合のうち
   assignedAtが最も新しいものを基準に「実際の配信時刻－CSV予定時刻」のずれを求め、
   そのずれだけCSV時刻全体を平行移動する。これによりCSVの2分/3分等の間隔は崩れない。 */
function estimateByCsvIntervals(data, queueSortedList){
  var now = Date.now();
  var latest = null;
  Object.keys(data.courts||{}).forEach(function(cno){
    var c=(data.courts||{})[cno];
    if(!c || !c.match || !c.assignedAt || !c.match.time) return;
    if(!latest || c.assignedAt > latest.assignedAt) latest=c;
  });

  var shiftMs = 0;
  if(latest){
    var sched = scheduledTsToday(latest.match.time, latest.assignedAt);
    if(sched!==null) shiftMs = latest.assignedAt - sched;
  }

  var map={};
  queueSortedList.forEach(function(m){
    var sched=scheduledTsToday(m.time, now);
    if(sched!==null) map[m.id]=sched+shiftMs;
  });
  return map;
}

/* 実績20試合以上：直近20試合の assignedAt→finishedAt 平均を使い、
   各コートの次回空き時刻を計算して、キューを早く空くコートへ順次仮想配置する。 */
function estimateByRecent20(data, queueSortedList){
  var avgDur = avgMatchDurationMs(data);
  if(avgDur === null) return null;
  var courtCount = data.courtCount || 0;
  if(courtCount <= 0) return null;
  var now = Date.now();
  var courtFreeAt = [];
  for(var i=1;i<=courtCount;i++){
    var c = (data.courts||{})[String(i)];
    // 使用終了コートは配信対象だけでなく予測上のコート数からも除外する
    if(c && c.status==='inactive') continue;
    if(c && c.match && (c.status==='live' || c.status==='assigned')){
      var baseAt = c.assignedAt || now;
      var elapsed = now - baseAt;
      var remaining = Math.max(avgDur - elapsed, 60*1000);
      courtFreeAt.push(now + remaining);
    }else{
      courtFreeAt.push(now);
    }
  }
  if(!courtFreeAt.length) return {};
  var map = {};
  queueSortedList.forEach(function(m){
    var minIdx = 0;
    for(var j=1;j<courtFreeAt.length;j++) if(courtFreeAt[j] < courtFreeAt[minIdx]) minIdx=j;
    map[m.id] = courtFreeAt[minIdx];
    courtFreeAt[minIdx] += avgDur;
  });
  return map;
}

/* 予測ロジック本体
   0～19試合終了：CSVの時間差（最新assignedAtで全体を平行移動）
   20試合以上終了：直近20試合の平均所要時間 × コート別空き時刻シミュレーション */
function estimateQueueStartTimes(data, queueSortedList){
  var completed = toArray(data.matchDurations).length;
  if(completed < 20) return estimateByCsvIntervals(data, queueSortedList);
  return estimateByRecent20(data, queueSortedList);
}

function timeToMinutes(t){
  if(!t) return null;
  var m = /^(\d{1,2}):(\d{2})$/.exec(t.trim());
  if(!m) return null;
  return parseInt(m[1],10)*60 + parseInt(m[2],10);
}

/* ══ 選手名で自分の試合を検索する ══ */
function searchPlayerMatches(data, query){
  var q = (query||'').trim();
  if(!q) return [];
  var results = [];
  function nameMatches(arr){ return toArray(arr).some(function(n){ return n && n.indexOf(q) >= 0; }); }

  // ① コートで進行中・配信済み
  Object.keys(data.courts||{}).forEach(function(cno){
    var c = data.courts[cno];
    if(c && c.match && (nameMatches(c.match.teamA) || nameMatches(c.match.teamB))){
      var mine = nameMatches(c.match.teamA) ? 'A' : 'B';
      var opp = mine==='A' ? c.match.teamB : c.match.teamA;
      results.push({ status: c.status==='live'?'live':'assigned', courtNo:cno, opponent: teamLabel(opp), time: c.match.time||'', matchCode: c.match.matchCode });
    }
  });

  // ② キュー待ち（予測時刻順での待ち順を算出）
  var queueSorted = toArray(data.queue).slice().sort(function(a,b){
    var ma=timeToMinutes(a.time), mb=timeToMinutes(b.time);
    if(ma===null && mb===null) return 0;
    if(ma===null) return 1;
    if(mb===null) return -1;
    return ma-mb;
  });
  var dynEstimates = estimateQueueStartTimes(data, queueSorted);
  queueSorted.forEach(function(m, idx){
    if(nameMatches(m.teamA) || nameMatches(m.teamB)){
      var mine = nameMatches(m.teamA) ? 'A' : 'B';
      var opp = mine==='A' ? m.teamB : m.teamA;
      var timeLabel = dynEstimates && dynEstimates[m.id] ? fmtHHMM(dynEstimates[m.id])+'頃' : (m.time||'');
      results.push({ status:'queued', position: idx+1, opponent: teamLabel(opp), time: timeLabel, matchCode: m.matchCode });
    }
  });

  // ③ リーグ戦の結果済み試合
  Object.keys(data.leagues||{}).forEach(function(lid){
    var lg = data.leagues[lid];
    toArray(lg.matches).forEach(function(m){
      if(!m.result) return;
      var a = lg.participants[m.i]||[], b = lg.participants[m.j]||[];
      if(nameMatches(a) || nameMatches(b)){
        var mine = nameMatches(a) ? 'A' : 'B';
        var opp = mine==='A' ? b : a;
        var won = (mine==='A' && m.result.winner==='A') || (mine==='B' && m.result.winner==='B');
        results.push({ status:'done', opponent: teamLabel(opp),
          resultLabel: m.result.voided ? '順位計算除外' : (m.result.retired ? (won?'棄権勝ち':'棄権負け') : ((won?'○ 勝ち':'× 負け')+'　'+m.result.gameWinsA+'-'+m.result.gameWinsB)),
          matchCode: lg.name+'-'+(m.id+1) });
      }
    });
  });

  // ④ 決勝トーナメントの結果済み試合
  Object.keys(data.brackets||{}).forEach(function(bid){
    var br = data.brackets[bid];
    toArray(br.matches).forEach(function(m){
      if(!m.result || !m.teamA || !m.teamB) return;
      if(nameMatches(m.teamA) || nameMatches(m.teamB)){
        var mine = nameMatches(m.teamA) ? 'A' : 'B';
        var opp = mine==='A' ? m.teamB : m.teamA;
        var won = (mine==='A' && m.result.winner==='A') || (mine==='B' && m.result.winner==='B');
        results.push({ status:'done', opponent: teamLabel(opp),
          resultLabel: m.result.voided ? '順位計算除外' : (m.result.retired ? (won?'棄権勝ち':'棄権負け') : ((won?'○ 勝ち':'× 負け')+'　'+m.result.gameWinsA+'-'+m.result.gameWinsB)),
          matchCode: br.name+'-'+m.id });
      }
    });
  });

  // 順序: 進行中 → キュー待ち(時刻順=検索時点でqueueSorted順に積んだのでそのまま) → 結果済み
  var order = { live:1, assigned:1, queued:2, done:3 };
  results.sort(function(a,b){ return (order[a.status]||9) - (order[b.status]||9); });
  return results;
}

function buildPlayerSearch(data){
  var wrap = el('div',{className:'settings-section',style:{marginTop:'8px'}});
  wrap.appendChild(el('div',{className:'settings-section-title'},'自分の試合を探す'));
  var box = el('div',{className:'settings-list',style:{padding:'12px 16px'}});
  var inp = el('input',{className:'settings-inp',placeholder:'選手名の一部を入力（例: 山田）'});
  var resultsWrap = el('div',{style:{marginTop:'10px'}});

  function renderResults(){
    resultsWrap.innerHTML = '';
    var matches = searchPlayerMatches(data, inp.value);
    if(!inp.value.trim()){
      return;
    }
    if(matches.length===0){
      resultsWrap.appendChild(el('div',{style:{fontSize:13,color:'var(--ink3)',padding:'6px 0'}},'該当する試合が見つかりません。'));
      return;
    }
    matches.forEach(function(m){
      var line;
      if(m.status==='live'){
        line = el('div',{className:'search-hit'},[el('span',{className:'search-badge live'},'進行中'), 'コート'+m.courtNo+'　vs '+m.opponent]);
      }else if(m.status==='assigned'){
        line = el('div',{className:'search-hit'},[el('span',{className:'search-badge live'},'開始待ち'), 'コート'+m.courtNo+'　vs '+m.opponent]);
      }else if(m.status==='queued'){
        line = el('div',{className:'search-hit'},[el('span',{className:'search-badge queued'},'待ち'+m.position+'番目'), (m.time?m.time+'頃　':'')+'vs '+m.opponent]);
      }else{
        line = el('div',{className:'search-hit'},[el('span',{className:'search-badge done'},'結果'), m.resultLabel+'　vs '+m.opponent]);
      }
      resultsWrap.appendChild(line);
    });
  }
  inp.oninput = renderResults;
  box.appendChild(inp);
  box.appendChild(resultsWrap);
  wrap.appendChild(box);
  return wrap;
}

var progressRefreshTimer=null;

function mountProgress(eventId,data,role){
  var isAdmin=role==='admin';
  var root=el('div',{style:{minHeight:'100vh'}});
  var helpBtn = el('button',{className:'appbar-help-btn'},'?');
  helpBtn.onclick = showHelpModal;
  var appbar=el('div',{className:'appbar'},[
    el('span',{className:'appbar-title'},(data.eventName||'大会Now')),
    isAdmin?null:el('span',{className:'viewer-chip'},'閲覧'),
    helpBtn
  ]);
  root.appendChild(appbar);

  var tabs = el('div',{className:'tabs'});
  var tabCourts = el('button',{className:'tab-btn'+(activeTab==='courts'?' active':'')},'コート状況');
  var tabTournament = el('button',{className:'tab-btn'+(activeTab==='tournament'?' active':'')},'リーグ・トーナメント');
  tabCourts.onclick=function(){ activeTab='courts'; mountProgress(eventId,data,role); };
  tabTournament.onclick=function(){ activeTab='tournament'; mountProgress(eventId,data,role); };
  tabs.appendChild(tabCourts); tabs.appendChild(tabTournament);
  if(isAdmin){
    var tabWithdrawal = el('button',{className:'tab-btn'+(activeTab==='withdrawal'?' active':'')},'棄権');
    tabWithdrawal.onclick=function(){ activeTab='withdrawal'; mountProgress(eventId,data,role); };
    tabs.appendChild(tabWithdrawal);
    var tabSettings = el('button',{className:'tab-btn'+(activeTab==='settings'?' active':'')},'設定');
    tabSettings.onclick=function(){ activeTab='settings'; mountProgress(eventId,data,role); };
    tabs.appendChild(tabSettings);
  }
  root.appendChild(tabs);
  if(isAdmin && data.demoMode) root.appendChild(buildDemoGuide(eventId,data));
  if(isAdmin && data.demoMode){ var demoStage=buildDemoBadoruStage(eventId,data); if(demoStage) root.appendChild(demoStage); }

  if(activeTab==='withdrawal' && isAdmin){
    var withdrawalWrap=el('div',{style:{paddingBottom:'24px'}});
    withdrawalWrap.appendChild(buildWithdrawalManager(eventId, data));
    root.appendChild(withdrawalWrap);
    render(root);
    return;
  }

  if(activeTab==='settings' && isAdmin){
    root.appendChild(buildSettingsView(eventId, data));
    render(root);
    return;
  }

  if(activeTab==='tournament'){
    root.appendChild(buildTournamentView(eventId, data, isAdmin));
    render(root);
    return;
  }

  root.appendChild(buildPlayerSearch(data));

  root.appendChild(el('div',{className:'section-label'},'コート状況'));
  var grid=el('div',{className:'court-grid'});
  var courtCount=data.courtCount||0;
  for(var i=1;i<=courtCount;i++){
    grid.appendChild(buildCourtCard(i,(data.courts||{})[String(i)],eventId,isAdmin,toArray(data.queue).length>0,data.playerClubs||{}));
  }
  root.appendChild(grid);

  var queue=toArray(data.queue);
  var queueSorted=queue.slice().sort(function(a,b){
    var ma=timeToMinutes(a.time), mb=timeToMinutes(b.time);
    if(ma===null && mb===null) return 0;
    if(ma===null) return 1; // 時刻未設定・解釈できないものは末尾へ
    if(mb===null) return -1;
    return ma-mb;
  });
  var dynamicEstimates = estimateQueueStartTimes(data, queueSorted);
  var queueLabel = dynamicEstimates ? 'キュー待ち（残り'+queue.length+'件・実績ペースによる予測）' : 'キュー待ち（残り'+queue.length+'件・予測時刻の早い順）';
  root.appendChild(el('div',{className:'section-label'},queueLabel));
  var queueWrap=el('div');
  queueSorted.forEach(function(m,idx){
    var timeLabel = dynamicEstimates && dynamicEstimates[m.id] ? fmtHHMM(dynamicEstimates[m.id])+'頃' : (m.time||'');
    queueWrap.appendChild(el('div',{className:'queue-row'},[
      el('span',{className:'queue-idx'},String(idx+1)),
      el('span',{className:'queue-teams'},teamLabel(m.teamA)+' vs '+teamLabel(m.teamB)),
      el('span',{className:'queue-time'},timeLabel)
    ]));
  });
  if(queue.length===0){
    queueWrap.appendChild(el('div',{style:{padding:'12px 18px',color:'var(--ink3)',fontSize:13}},'キューは空です'));
  }
  root.appendChild(queueWrap);

  render(root);
  if(progressRefreshTimer) clearTimeout(progressRefreshTimer);
  progressRefreshTimer=setTimeout(function(){ mountProgress(eventId,data,role); },1000);
}

/* ══ 起動 ══ */
function startAdmin(eventId){
  watchAndDispatch(eventId);
  dbListen(eventId,function(data){
    if(!data){
      render(el('div',{style:{padding:20}},'大会データが見つかりません'));
      return;
    }
    mountProgress(eventId,data,'admin');
  });
}
function startView(eventId){
  dbListen(eventId,function(data){
    if(!data){
      render(el('div',{style:{padding:20}},'大会データが見つかりません'));
      return;
    }
    mountProgress(eventId,data,'view');
  });
}

function boot(){
  var h=parseHash();
  if(h.mode==='admin'&&h.eventId){startAdmin(h.eventId);return;}
  if(h.mode==='view'&&h.eventId){startView(h.eventId);return;}
  mountSetup();
}
window.addEventListener('hashchange',function(){dbOff();boot();});
boot();
</script>
